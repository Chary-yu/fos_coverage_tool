name: R8 Targeted Adapterless Legacy d4808dbb

on:
  push:
    branches:
      - r8-targeted-adapterless-d4808dbb-20260914

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install focused dependency
        run: python -m pip install pymysql
      - name: Run adapterless legacy compatibility regression
        run: >-
          python -m unittest
          tests.release.test_vfoswind_conductor_legacy_config
          tests.release.test_vfoswind_attempt_config -v
      - name: Validate R8 orchestration contract
        run: python scripts/validate_release_orchestration.py
