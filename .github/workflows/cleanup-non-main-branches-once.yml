name: Cleanup non-main branches once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Delete every remote branch except main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --heads origin \
            | awk '{print $2}' \
            | sed 's#refs/heads/##' \
            | while IFS= read -r branch; do
                [ -n "$branch" ] || continue
                [ "$branch" = "main" ] && continue
                encoded="$(python - "$branch" <<'PY'
          import sys
          try:
              from urllib.parse import quote
          except ImportError:
              from urllib import quote
          print(quote(sys.argv[1], safe=''))
          PY
          )"
                echo "Deleting branch: $branch"
                curl --fail --silent --show-error \
                  -X DELETE \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/${REPO}/git/refs/heads/${encoded}"
              done

      - name: Verify main is the only branch
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##')
          printf 'Remaining branches:\n'
          printf '  %s\n' "${branches[@]}"
          [ "${#branches[@]}" -eq 1 ]
          [ "${branches[0]}" = "main" ]

      - name: Remove this one-time workflow from main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/cleanup-non-main-branches-once.yml
          git add -A
          git commit -m "chore: finish branch cleanup"
          git push origin HEAD:main
