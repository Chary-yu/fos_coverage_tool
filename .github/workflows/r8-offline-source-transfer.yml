name: R8 Offline Source Transfer Tooling

on:
  push:
    branches:
      - r8-offline-transfer-tooling
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_SHA: cd8bc9e8f2982c54f3f9c172b5f281895ba5671f
  TARGET_TREE: 50dc0f9414ecb27777e3e56235e0970294a19d36
  BASELINE_SHA: e9fcc837a1ac9847f3966fc8ddb2aed92ca473fc
  E36_SHA: e36f823d484251ef57054fbbab6b080c95a1b611

jobs:
  build-offline-source-transfer:
    name: Build exact Git bundle as self-extracting TXT
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact locked R8 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          path: source

      - name: Verify exact source identity and ancestry
        run: |
          set -euo pipefail
          cd source
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test -z "$(git status --porcelain --untracked-files=all)"
          git cat-file -e "${BASELINE_SHA}^{commit}"
          git cat-file -e "${E36_SHA}^{commit}"
          test "$(git merge-base "$E36_SHA" "$TARGET_SHA")" = "$E36_SHA"

      - name: Create and independently verify complete Git bundle
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r8-source-transfer" .artifacts/r8-source-transfer
          BUNDLE="$RUNNER_TEMP/r8-source-transfer/repository-${TARGET_SHA}.bundle"
          (
            cd source
            git branch -f offline-final "$TARGET_SHA"
            git branch -f offline-baseline "$BASELINE_SHA"
            git branch -f offline-e36 "$E36_SHA"
            git bundle create "$BUNDLE" \
              refs/heads/offline-final \
              refs/heads/offline-baseline \
              refs/heads/offline-e36
            git bundle verify "$BUNDLE"
          )
          VERIFY="$RUNNER_TEMP/r8-source-transfer/verify-clone"
          git clone -q -b offline-final "$BUNDLE" "$VERIFY"
          test "$(cd "$VERIFY" && git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cd "$VERIFY" && git rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          (cd "$VERIFY" && git cat-file -e "${BASELINE_SHA}^{commit}")
          (cd "$VERIFY" && git cat-file -e "${E36_SHA}^{commit}")
          (cd "$VERIFY" && git fsck --full --strict)
          sha256sum "$BUNDLE" > "$RUNNER_TEMP/r8-source-transfer/bundle.sha256"

      - name: Build CentOS 7 and Git 1.8 compatible self-extracting TXT
        env:
          BUNDLE_PATH: ${{ runner.temp }}/r8-source-transfer/repository-${{ env.TARGET_SHA }}.bundle
          BUNDLE_SHA_FILE: ${{ runner.temp }}/r8-source-transfer/bundle.sha256
          OUTPUT_TXT: .artifacts/r8-source-transfer/fos_r8_offline_source_bundle_cd8bc9e8_20260910.txt
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          import textwrap
          from pathlib import Path

          bundle_path = Path(os.environ['BUNDLE_PATH'])
          output_path = Path(os.environ['OUTPUT_TXT'])
          expected_bundle_sha = Path(os.environ['BUNDLE_SHA_FILE']).read_text(
              encoding='utf-8').split()[0].strip().lower()
          payload = base64.b64encode(bundle_path.read_bytes()).decode('ascii')
          payload = '\n'.join(textwrap.wrap(payload, 76))

          target_sha = os.environ['TARGET_SHA']
          target_tree = os.environ['TARGET_TREE']
          baseline_sha = os.environ['BASELINE_SHA']
          e36_sha = os.environ['E36_SHA']

          header = r'''#!/bin/bash
          # FOS R8 exact offline source transfer
          # This file stages an exact Git source bundle/check-out only.
          # It does not modify production, databases, systemd, Nginx or CURRENT.
          bash -s -- "$0" "$@" <<'FOS_R8_SOURCE_TRANSFER'
          set -euo pipefail
          umask 077

          SELF="$0"
          DEST_ROOT="${1:-/home/zcyu/coverage_candidate/r8_offline_cd8bc9e8/source_transfer}"
          TARGET_SHA="__TARGET_SHA__"
          TARGET_TREE="__TARGET_TREE__"
          BASELINE_SHA="__BASELINE_SHA__"
          E36_SHA="__E36_SHA__"
          EXPECTED_BUNDLE_SHA256="__BUNDLE_SHA__"
          BUNDLE="$DEST_ROOT/repository-${TARGET_SHA}.bundle"
          SOURCE_CHECKOUT="$DEST_ROOT/source_checkout"
          IDENTITY="$DEST_ROOT/source_transfer_identity.txt"

          fail() {
              echo "ERROR: $*" >&2
              echo "OFFLINE_SOURCE_TRANSFER=FAIL" >&2
              exit 1
          }

          command -v python3 >/dev/null 2>&1 || fail "python3 is required"
          command -v git >/dev/null 2>&1 || fail "git is required"
          mkdir -p "$DEST_ROOT"
          [ ! -L "$DEST_ROOT" ] || fail "destination root must not be a symlink"

          TMP_BUNDLE="$BUNDLE.part.$$"
          rm -f "$TMP_BUNDLE"
          trap 'rm -f "$TMP_BUNDLE"' EXIT

          python3 - "$SELF" "$TMP_BUNDLE" "$EXPECTED_BUNDLE_SHA256" <<'PY_DECODE'
          from __future__ import print_function
          import base64
          import hashlib
          import os
          import sys

          source, output, expected = sys.argv[1:4]
          marker = b"__FOS_R8_GIT_BUNDLE_BASE64__\n"
          with open(source, "rb") as stream:
              raw = stream.read()
          if marker not in raw:
              raise SystemExit("embedded Git bundle marker is missing")
          encoded = raw.split(marker, 1)[1]
          try:
              decoded = base64.b64decode(encoded)
          except Exception as exc:
              raise SystemExit("embedded Git bundle base64 is invalid: {}".format(exc))
          observed = hashlib.sha256(decoded).hexdigest()
          if observed.lower() != expected.lower():
              raise SystemExit("embedded Git bundle SHA256 mismatch")
          with open(output, "wb") as stream:
              stream.write(decoded)
              stream.flush()
              try:
                  os.fsync(stream.fileno())
              except OSError:
                  pass
          print("EMBEDDED_BUNDLE_SHA256={}".format(observed))
          PY_DECODE

          if [ -e "$BUNDLE" ] || [ -L "$BUNDLE" ]; then
              [ -f "$BUNDLE" ] && [ ! -L "$BUNDLE" ] || fail "existing bundle is not a regular file"
              OBSERVED_EXISTING="$(python3 - "$BUNDLE" <<'PY_HASH'
          import hashlib, sys
          h = hashlib.sha256()
          with open(sys.argv[1], 'rb') as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                  h.update(chunk)
          print(h.hexdigest())
          PY_HASH
          )"
              [ "$OBSERVED_EXISTING" = "$EXPECTED_BUNDLE_SHA256" ] || fail "existing bundle SHA256 mismatch"
              rm -f "$TMP_BUNDLE"
          else
              mv "$TMP_BUNDLE" "$BUNDLE"
          fi
          chmod 0600 "$BUNDLE"

          VERIFY_REPO="$DEST_ROOT/.bundle_verify_repo.$$"
          rm -rf "$VERIFY_REPO"
          mkdir -p "$VERIFY_REPO"
          (
              cd "$VERIFY_REPO"
              git init -q
              git bundle verify "$BUNDLE"
          ) || fail "git bundle verify failed"
          rm -rf "$VERIFY_REPO"

          verify_checkout() {
              [ -d "$SOURCE_CHECKOUT" ] && [ ! -L "$SOURCE_CHECKOUT" ] || return 1
              ACTUAL_SHA="$(cd "$SOURCE_CHECKOUT" && git rev-parse HEAD 2>/dev/null || true)"
              ACTUAL_TREE="$(cd "$SOURCE_CHECKOUT" && git rev-parse 'HEAD^{tree}' 2>/dev/null || true)"
              [ "$ACTUAL_SHA" = "$TARGET_SHA" ] || return 1
              [ "$ACTUAL_TREE" = "$TARGET_TREE" ] || return 1
              [ -z "$(cd "$SOURCE_CHECKOUT" && git status --porcelain --untracked-files=all 2>/dev/null)" ] || return 1
              (cd "$SOURCE_CHECKOUT" && git cat-file -e "${BASELINE_SHA}^{commit}" 2>/dev/null) || return 1
              (cd "$SOURCE_CHECKOUT" && git cat-file -e "${E36_SHA}^{commit}" 2>/dev/null) || return 1
              return 0
          }

          if [ -e "$SOURCE_CHECKOUT" ] || [ -L "$SOURCE_CHECKOUT" ]; then
              verify_checkout || fail "existing source_checkout is not the exact locked R8 source"
              echo "SOURCE_CHECKOUT_REUSED=YES"
          else
              git clone -q -b offline-final "$BUNDLE" "$SOURCE_CHECKOUT" || fail "Git 1.8 compatible bundle clone failed"
              verify_checkout || fail "cloned source identity verification failed"
              echo "SOURCE_CHECKOUT_REUSED=NO"
          fi

          (cd "$SOURCE_CHECKOUT" && git fsck --full --strict) || fail "source Git fsck failed"
          ACTUAL_SHA="$(cd "$SOURCE_CHECKOUT" && git rev-parse HEAD)"
          ACTUAL_TREE="$(cd "$SOURCE_CHECKOUT" && git rev-parse 'HEAD^{tree}')"

          cat > "$IDENTITY" <<EOF_IDENTITY
          FORMAT=FOS_R8_OFFLINE_SOURCE_TRANSFER_V1
          PRODUCTION_MUTATION=NO
          REPOSITORY=Chary-yu/fos_coverage_tool
          TARGET_SHA=$TARGET_SHA
          TARGET_TREE=$TARGET_TREE
          BASELINE_SHA=$BASELINE_SHA
          E36_SHA=$E36_SHA
          BUNDLE_SHA256=$EXPECTED_BUNDLE_SHA256
          BUNDLE_PATH=$BUNDLE
          SOURCE_CHECKOUT=$SOURCE_CHECKOUT
          ACTUAL_SHA=$ACTUAL_SHA
          ACTUAL_TREE=$ACTUAL_TREE
          EOF_IDENTITY
          chmod 0600 "$IDENTITY"

          echo "TARGET_SHA=$TARGET_SHA"
          echo "TARGET_TREE=$TARGET_TREE"
          echo "BASELINE_SHA=$BASELINE_SHA"
          echo "BUNDLE_SHA256=$EXPECTED_BUNDLE_SHA256"
          echo "BUNDLE=$BUNDLE"
          echo "SOURCE_CHECKOUT=$SOURCE_CHECKOUT"
          echo "IDENTITY=$IDENTITY"
          echo "OFFLINE_SOURCE_TRANSFER=PASS"
          FOS_R8_SOURCE_TRANSFER
          RC=$?
          exit "$RC"
          __FOS_R8_GIT_BUNDLE_BASE64__
          '''

          header = textwrap.dedent(header).replace('__TARGET_SHA__', target_sha)
          header = header.replace('__TARGET_TREE__', target_tree)
          header = header.replace('__BASELINE_SHA__', baseline_sha)
          header = header.replace('__E36_SHA__', e36_sha)
          header = header.replace('__BUNDLE_SHA__', expected_bundle_sha)
          output_path.write_text(header + payload + '\n', encoding='utf-8')
          os.chmod(str(output_path), 0o700)
          PY
          bash -n "$OUTPUT_TXT"
          sha256sum "$OUTPUT_TXT"

      - name: Smoke-test self-extracting TXT
        env:
          INPUT_TXT: .artifacts/r8-source-transfer/fos_r8_offline_source_bundle_cd8bc9e8_20260910.txt
        run: |
          set -euo pipefail
          TEST_ROOT="$RUNNER_TEMP/r8-source-transfer/self-test"
          bash "$INPUT_TXT" "$TEST_ROOT"
          test "$(cd "$TEST_ROOT/source_checkout" && git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cd "$TEST_ROOT/source_checkout" && git rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          grep -Fqx "OFFLINE_SOURCE_TRANSFER=PASS" <(bash "$INPUT_TXT" "$TEST_ROOT" | tail -1)

      - name: Upload single TXT transfer artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: fos-r8-offline-source-transfer-cd8bc9e8
          path: .artifacts/r8-source-transfer/fos_r8_offline_source_bundle_cd8bc9e8_20260910.txt
          if-no-files-found: error
          retention-days: 30
