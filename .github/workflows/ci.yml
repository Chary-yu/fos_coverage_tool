name: CI

on:
  workflow_dispatch:
    inputs:
      cross_layer_evidence:
        description: 'Path to an instrumented browser/server performance JSON'
        required: false
        type: string
  pull_request:
    paths:
      - '**.py'
      - '**.js'
      - '**.sql'
      - '**.css'
      - '**.html'
      - '**.json'
      - '**.sh'
      - '**.service'
      - 'requirements*.txt'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  push:
    paths:
      - '**.py'
      - '**.js'
      - '**.sql'
      - '**.css'
      - '**.html'
      - '**.json'
      - '**.sh'
      - '**.service'
      - 'requirements*.txt'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-py36.txt ]; then pip install -r requirements-py36.txt; fi
          pip install pymysql

      - name: Run Targeted Lazy Collapse Test Suite
        run: |
          python -m unittest test_lazy_collapse_v11_fixes.py test_lazy_collapse_e2e_and_perf.py test_code_region.py test_code_detail_service.py test_code_detail_api.py -v
      - name: Run VNext targeted test suite
        run: python -m unittest discover -s tests/vnext -p 'test_*.py' -v
      - name: Verify canonical runtime participation
        run: python scripts/diagnostics/runtime_participation_audit.py
      - name: Verify canonical ownership and asset parity
        run: python scripts/diagnostics/canonical_ownership_audit.py
      - name: Verify VNext legacy dependency boundary
        run: python scripts/diagnostics/runtime_legacy_dependency_audit.py
      - name: Verify frontend VNext API contract
        run: python scripts/diagnostics/frontend_vnext_api_contract_audit.py
      - name: Verify configured runtime selection
        run: mkdir -p .artifacts/vnext && python scripts/diagnostics/configured_runtime_audit.py > .artifacts/vnext/configured_runtime_audit.json
      - name: Verify Scan immutability barrier
        run: python scripts/diagnostics/scan_immutability_audit.py
      - name: Verify connection pool transaction and liveness contract
        run: python scripts/diagnostics/connection_pool_audit.py
      - name: Verify durable job lifecycle contract
        run: python scripts/diagnostics/job_lifecycle_audit.py
      - name: Verify legacy compatibility surfaces
        run: >-
          python scripts/diagnostics/legacy_compatibility_smoke.py
          --output .artifacts/vnext/legacy-compatibility.json
      - name: Verify changed-path specialist mapping
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: >-
          python scripts/diagnostics/changed_test_selection.py
          --base "${GITHUB_BASE_SHA}" --before "${GITHUB_EVENT_BEFORE}"
          --head "${GITHUB_SHA}" --run-tests
          --manifest .artifacts/vnext/changed_test_selection.json
      - name: Build machine-readable VNext evidence matrix
        env:
          COVERAGE_LEGACY_COMPAT_TESTS_MANIFEST: .artifacts/vnext/legacy-compatibility.json
        run: mkdir -p .artifacts/vnext && python scripts/diagnostics/build_vnext_evidence.py .artifacts/vnext/architecture_ownership_matrix.json
      - name: Build fail-closed Gate A-F evidence matrix
        env:
          COVERAGE_LEGACY_COMPAT_TESTS_MANIFEST: .artifacts/vnext/legacy-compatibility.json
        run: >-
          python scripts/diagnostics/gate_matrix.py --allow-incomplete
          --output .artifacts/vnext/gate-matrix.json
      - name: Upload VNext machine evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: vnext-evidence-python-${{ matrix.python-version }}
          path: .artifacts/vnext
          if-no-files-found: error

  specialist-regression:
    name: Specialist regression suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-py36.txt
          pip install pymysql
      - name: Run specialist suites
        run: |
          python -m unittest discover -s tests/database -p 'test_*.py' -v
          python -m unittest discover -s tests/code_detail -p 'test_*.py' -v
          python -m unittest discover -s tests/incremental -p 'test_*.py' -v
          python -m unittest discover -s tests/progress -p 'test_*.py' -v
          python -m unittest discover -s tests/release -p 'test_*.py' -v
          python -m unittest discover -s tests/security -p 'test_*.py' -v

  mysql-vnext-integration:
    name: Real MariaDB VNext integration
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb@sha256:24e76fcec8c003a0362d0dd53f4806e7e79458d7fdeaf47437760e19496f5a9c # 11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-py36.txt
          pip install pymysql
      - name: Run disposable real-MariaDB VNext integration
        run: |
          set -o pipefail
          mkdir -p .artifacts
          python scripts/diagnostics/mysql_vnext_integration.py \
            --create-disposable --host 127.0.0.1 --port 3306 \
            --user root --password root | tee .artifacts/mariadb_vnext_integration.json
      - name: Upload MariaDB integration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: mariadb-vnext-integration-evidence
          path: .artifacts/mariadb_vnext_integration.json
          if-no-files-found: error

  py36-compat:
    name: Python 3.6 compatibility (changed runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Compile changed runtime modules
        run: |
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace python@sha256:f8652afaf88c25f0d22354d547d892591067aa4026a7fa9a6819df9f300af6fc \
            bash -lc "find app scripts -type f -name '*.py' -print0 | xargs -0 python -m py_compile && python -m py_compile source_reader.py code_detail_service.py coverage_check.py enhance_coverage.py"
      - name: Run compatibility-focused tests
        run: |
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace python@sha256:f8652afaf88c25f0d22354d547d892591067aa4026a7fa9a6819df9f300af6fc \
            python -m unittest \
            tests.code_detail.test_phase2_core \
            tests.incremental.test_phase5_inject_path \
            tests.vnext.test_runtime_config \
            tests.vnext.test_vnext_runtime -v

  mock-dom-regression:
    name: Mock DOM regression (not browser evidence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: node test_lazy_collapse_browser_smoke.js

  real-browser-e2e:
    name: Real browser E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run required real-browser and canonical VNext HTTP suites
        run: mkdir -p .artifacts && npx playwright test tests/browser --reporter=json > .artifacts/browser_playwright.json
      - run: mkdir -p .artifacts && npm run perf:synthetic-dom -- .artifacts/synthetic_dom_microbenchmark.json
      - name: Validate browser performance evidence boundary
        run: python scripts/diagnostics/performance_evidence_audit.py .artifacts/synthetic_dom_microbenchmark.json --allow-partial
      - name: Upload browser functional evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: browser-functional-evidence
          path: |
            .artifacts/browser_playwright.json
            .artifacts/synthetic_dom_microbenchmark.json
          if-no-files-found: error

  cross-layer-performance:
    name: Cross-layer performance gate (instrumented evidence)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.cross_layer_evidence != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require cross-layer metrics
        run: |
          set -o pipefail
          mkdir -p .artifacts
          python scripts/diagnostics/performance_evidence_audit.py \
            "${{ inputs.cross_layer_evidence }}" --require-cross-layer \
            | tee .artifacts/cross_layer_performance.json
      - name: Upload cross-layer performance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: cross-layer-performance-evidence
          path: .artifacts/cross_layer_performance.json
          if-no-files-found: error
