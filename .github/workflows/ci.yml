name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-py36.txt ]; then pip install -r requirements-py36.txt || true; fi
          pip install pymysql || true

      - name: Run Targeted Lazy Collapse Test Suite
        run: |
          python -m unittest test_lazy_collapse_v11_fixes.py test_lazy_collapse_e2e_and_perf.py test_code_region.py test_code_detail_service.py test_code_detail_api.py -v
