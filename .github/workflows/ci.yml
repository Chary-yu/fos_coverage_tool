name: CI

on:
  workflow_dispatch:
    inputs:
      real_browser_url:
        description: 'Exact Candidate HTML URL for real HTTP + Chromium Gate E evidence'
        required: false
        type: string
      real_browser_expected_revision:
        description: 'Exact 40-character Candidate commit SHA; defaults to the workflow SHA'
        required: false
        type: string
      real_browser_release_validation_session_id:
        description: 'Exact immutable publication/validation attempt ID for the served Candidate'
        required: false
        type: string
      real_browser_candidate_artifact_sha256:
        description: 'SHA256 of the CandidateArtifactManifest artifact inventory'
        required: false
        type: string
      real_browser_served_root_sha256:
        description: 'SHA256 of the immutable Served Root inventory'
        required: false
        type: string
      production_backup_path:
        description: 'Absolute path to an operator-verified production backup on the production-rehearsal runner'
        required: false
        type: string
      production_backup_manifest:
        description: 'Absolute path to the external verified-backup provenance manifest on the runner'
        required: false
        type: string
      production_rehearsal_config:
        description: 'Absolute path to the disposable MariaDB rehearsal config on the runner'
        required: false
        type: string
      candidate_build:
        description: 'Run the protected exact-checkout Candidate Build + attestation lane'
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - '**.py'
      - '**.js'
      - '**.sql'
      - '**.css'
      - '**.html'
      - '**.json'
      - '**.md'
      - '**.sh'
      - '**.service'
      - 'requirements*.txt'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/trusted-candidate-builder.yml'
      - '.github/workflows/trusted-production-candidate-builder.yml'
  push:
    paths:
      - '**.py'
      - '**.js'
      - '**.sql'
      - '**.css'
      - '**.html'
      - '**.json'
      - '**.md'
      - '**.sh'
      - '**.service'
      - 'requirements*.txt'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/trusted-candidate-builder.yml'
      - '.github/workflows/trusted-production-candidate-builder.yml'

permissions:
  contents: read

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install Node dependencies used by changed-path tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-py36.txt ]; then pip install -r requirements-py36.txt; fi
          pip install pymysql

      - name: Run Targeted Lazy Collapse Test Suite
        run: |
          python -m unittest test_lazy_collapse_v11_fixes.py test_lazy_collapse_e2e_and_perf.py test_code_region.py test_code_detail_service.py test_code_detail_api.py -v
      - name: Run VNext targeted test suite
        run: python -m unittest discover -s tests/vnext -p 'test_*.py' -v
      - name: Verify canonical runtime participation
        run: python scripts/diagnostics/runtime_participation_audit.py
      - name: Verify canonical ownership and asset parity
        run: python scripts/diagnostics/canonical_ownership_audit.py
      - name: Verify VNext legacy dependency boundary
        run: python scripts/diagnostics/runtime_legacy_dependency_audit.py
      - name: Verify frontend VNext API contract
        run: python scripts/diagnostics/frontend_vnext_api_contract_audit.py
      - name: Verify configured runtime selection
        run: mkdir -p .artifacts/vnext && python scripts/diagnostics/configured_runtime_audit.py > .artifacts/vnext/configured_runtime_audit.json
      - name: Verify Scan immutability barrier
        run: python scripts/diagnostics/scan_immutability_audit.py
      - name: Verify connection pool transaction and liveness contract
        run: python scripts/diagnostics/connection_pool_audit.py
      - name: Verify durable job lifecycle contract
        run: python scripts/diagnostics/job_lifecycle_audit.py
      - name: Verify legacy compatibility surfaces
        run: >-
          python scripts/diagnostics/legacy_compatibility_smoke.py
          --output .artifacts/vnext/legacy-compatibility.json
      - name: Build legacy retirement gate evidence
        env:
          COVERAGE_LEGACY_COMPAT_TESTS_MANIFEST: .artifacts/vnext/legacy-compatibility.json
        run: >-
          python scripts/diagnostics/legacy_retirement_audit.py
          --output .artifacts/vnext/legacy-retirement.json
      - name: Verify changed-path specialist mapping
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: >-
          python scripts/diagnostics/changed_test_selection.py
          --base "${GITHUB_BASE_SHA}" --before "${GITHUB_EVENT_BEFORE}"
          --head "${GITHUB_SHA}" --run-tests
          --manifest .artifacts/vnext/changed_test_selection.json
      - name: Build machine-readable VNext evidence matrix
        env:
          COVERAGE_LEGACY_COMPAT_TESTS_MANIFEST: .artifacts/vnext/legacy-compatibility.json
        run: mkdir -p .artifacts/vnext && python scripts/diagnostics/build_vnext_evidence.py .artifacts/vnext/architecture_ownership_matrix.json
      - name: Build fail-closed Gate A-F evidence matrix
        # Push/PR runs collect local evidence only; an incomplete local
        # artifact must not be presented as release readiness. Explicit
        # workflow_dispatch candidate runs are strict and fail closed.
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          COVERAGE_LEGACY_COMPAT_TESTS_MANIFEST: .artifacts/vnext/legacy-compatibility.json
        run: >-
          python scripts/diagnostics/gate_matrix.py
          --output .artifacts/vnext/gate-matrix.json
      - name: Build per-task Gate A-F status
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        run: >-
          python scripts/diagnostics/gate_task_status.py
          --matrix .artifacts/vnext/gate-matrix.json
          --output .artifacts/vnext/gate-task-status.json
      - name: Build Definition-of-Done status
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        run: >-
          python scripts/diagnostics/dod_status.py
          --matrix .artifacts/vnext/gate-matrix.json
          --task-status .artifacts/vnext/gate-task-status.json
          --output .artifacts/vnext/gate-dod-status.json
      - name: Evaluate release readiness decision
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          matrix = json.loads(Path('.artifacts/vnext/gate-matrix.json').read_text())
          Path('.artifacts/vnext/release-risk-register.json').write_text(json.dumps({
              'candidate_revision': matrix.get('candidate_revision', ''),
              'risks': [],
          }, indent=2, sort_keys=True))
          PY
          python scripts/diagnostics/release_readiness.py \
            --matrix .artifacts/vnext/gate-matrix.json \
            --task-status .artifacts/vnext/gate-task-status.json \
            --dod-status .artifacts/vnext/gate-dod-status.json \
            --risk-register .artifacts/vnext/release-risk-register.json \
            --output .artifacts/vnext/release-readiness.json
      - name: Assemble Gate A-F evidence bundle
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        run: >-
          python scripts/diagnostics/build_gate_evidence.py
          --output-root .artifacts/vnext/gate-bundle
          --output .artifacts/vnext/gate-bundle-summary.json
      - name: Upload VNext machine evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: vnext-evidence-python-${{ matrix.python-version }}
          path: .artifacts/vnext
          if-no-files-found: error

  specialist-regression:
    name: Specialist regression suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-py36.txt
          pip install pymysql
      - name: Install Node dependencies used by release specialist tests
        run: npm ci
      - name: Run specialist suites
        run: |
          python -m unittest discover -s tests/database -p 'test_*.py' -v
          python -m unittest discover -s tests/code_detail -p 'test_*.py' -v
          python -m unittest discover -s tests/incremental -p 'test_*.py' -v
          python -m unittest discover -s tests/progress -p 'test_*.py' -v
          python -m unittest discover -s tests/release -p 'test_*.py' -v
          python -m unittest discover -s tests/security -p 'test_*.py' -v

  semantic-migration-regression:
    name: Semantic migration regression (exact SHA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install migration test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-py36.txt
          pip install pymysql
      - name: Bind evidence to the checked out SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          mkdir -p .artifacts/semantic-migration
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          printf '%s\n' "$ACTUAL_SHA" > .artifacts/semantic-migration/commit-sha.txt
      - name: Run the focused migration contract tests
        run: |
          set -o pipefail
          python -m unittest \
            tests.vnext.test_migration_runner \
            tests.vnext.test_legacy_migration_contract \
            -v 2>&1 | tee .artifacts/semantic-migration/test.log
      - name: Verify Python 3.6 grammar for migration modules
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          paths = (
              Path('app/db/repositories/base.py'),
              Path('scripts/upgrade/migration_runner.py'),
              Path('tests/vnext/test_migration_runner.py'),
          )
          for path in paths:
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path),
                        feature_version=(3, 6))
          PY
      - name: Upload exact-SHA migration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: semantic-migration-regression-${{ github.sha }}
          path: .artifacts/semantic-migration
          if-no-files-found: error

  mysql-vnext-integration:
    name: Real MariaDB VNext integration
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb@sha256:24e76fcec8c003a0362d0dd53f4806e7e79458d7fdeaf47437760e19496f5a9c # 11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-py36.txt
          pip install pymysql
      - name: Run disposable real-MariaDB VNext integration
        run: |
          set -o pipefail
          mkdir -p .artifacts
          python scripts/diagnostics/mysql_vnext_integration.py \
            --create-disposable --host 127.0.0.1 --port 3306 \
            --user root --password root --migration-rehearsal \
            --scan-import-rehearsal \
            --migration-lines 90000 --migration-analyses 51000 \
            --migration-jobs 1 | tee .artifacts/mariadb_vnext_integration.json
      - name: Upload MariaDB integration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: mariadb-vnext-integration-evidence
          path: .artifacts/mariadb_vnext_integration.json
          if-no-files-found: error

  mysql55-compatibility:
    name: MariaDB 5.5 compatibility rehearsal
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb@sha256:8665c074af5a5fb7e04b9570fcf8551e9d82955182be50375d5013838d4f9137 # 5.5.64
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-py36.txt
          pip install pymysql
      - name: Run disposable MariaDB 5.5 compatibility rehearsal
        run: |
          set -o pipefail
          mkdir -p .artifacts
          python scripts/diagnostics/mysql_vnext_integration.py \
            --create-disposable --host 127.0.0.1 --port 3306 \
            --user root --password root --require-version-prefix 5.5 \
            --migration-rehearsal \
            --migration-lines 20000 --migration-analyses 10000 \
            --migration-jobs 1 | tee .artifacts/mariadb55_compatibility.json
      - name: Verify compatibility evidence identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path('.artifacts/mariadb55_compatibility.json').read_text())
          assert evidence['status'] == 'PASSED'
          assert evidence['synthetic'] is True
          assert evidence['required_version_prefix'] == '5.5'
          assert evidence['database_version'].startswith('5.5')
          assert evidence['candidate_revision']
          migration = evidence['checks']['legacy_to_vnext_migration_rehearsal']
          assert migration['status'] == 'PASSED'
          assert migration['collations']['source']['collation'] == 'utf8mb4_unicode_ci'
          assert migration['collations']['target']['collation'] == 'utf8mb4_general_ci'
          assert migration['checks']['collation_independent_semantic_hash'] is True
          assert migration['checks']['data_version_mutation_changes_semantic_hash'] is True
          migration_ready = migration['checks']['file_state_ready_gate']
          for run in ('first_run', 'second_run'):
              for project in ('fixture-a', 'fixture-b'):
                  project_ready = migration_ready[run][project]
                  assert project_ready['status'] == 'PASSED'
                  assert project_ready['data_version'] == project_ready['file_state_version']
                  assert project_ready['gate']['status'] == 'PASSED'
                  assert project_ready['gate']['completeness']['status'] == 'PASSED'
                  assert project_ready['gate']['pending_conservation']['status'] == 'PASSED'
                  assert project_ready['gate']['reconciliation']['status'] == 'PASSED'
                  aggregate = project_ready['aggregate']
                  assert int(aggregate['pending_total']) == (
                      int(aggregate['ordinary_pending_total']) +
                      int(aggregate['inherited_pending_total']) +
                      int(aggregate['manual_draft_pending_total'])
                  )
          assert evidence['checks']['schema_applied'] is True
          assert evidence['checks']['bulk_scan_ingest_and_seal'] is True
          assert evidence['checks']['bulk_analysis_upsert'] is True
          assert evidence['checks']['sql_progress_aggregate'] is True
          assert evidence['checks']['real_http_transport'] is True
          assert evidence['checks']['transaction_rollback'] is True
          ready = evidence['checks']['file_state_ready_gate']
          for phase in ('after_ingest', 'after_analysis', 'after_explicit_rebuild'):
              assert ready[phase]['status'] == 'PASSED'
              assert ready[phase]['data_version'] == ready[phase]['file_state_version']
              assert ready[phase]['gate']['completeness']['status'] == 'PASSED'
              assert ready[phase]['gate']['pending_conservation']['status'] == 'PASSED'
              assert ready[phase]['gate']['reconciliation']['status'] == 'PASSED'
          pages = evidence['checks']['file_state_paged_reads']
          assert pages['files']['status'] == 200
          assert pages['files']['rows'] == 1
          assert pages['pending']['status'] == 200
          assert pages['pending']['total'] == 1
          assert pages['pending']['rows'] == 1
          assert pages['incremental']['status'] == 200
          assert pages['incremental']['rows'] == 1
          PY
      - name: Run MariaDB 5.5 rehearsal under Python 3.6
        run: |
          set -o pipefail
          docker run --rm --network host -i \
            -v "$PWD:/workspace" -w /workspace python@sha256:f8652afaf88c25f0d22354d547d892591067aa4026a7fa9a6819df9f300af6fc \
            bash -s <<'PY' 2> .artifacts/mariadb55_py36_compatibility.stderr | tee .artifacts/mariadb55_py36_compatibility.json
          set -e
          python -m pip install --no-cache-dir -r requirements-py36.txt >/dev/null 2>&1
          python -c "import pymysql; assert pymysql.__version__ == '0.10.1', pymysql.__version__"
          python scripts/diagnostics/mysql_vnext_integration.py \
            --create-disposable --host 127.0.0.1 --port 3306 \
            --user root --password root --require-version-prefix 5.5 \
            --migration-rehearsal \
            --migration-lines 20000 --migration-analyses 10000 \
            --migration-jobs 1
          PY
      - name: Verify MariaDB 5.5 and Python 3.6 evidence identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path('.artifacts/mariadb55_py36_compatibility.json').read_text())
          assert evidence['status'] == 'PASSED'
          assert evidence['python_runtime'].startswith('3.6')
          assert evidence['database_version'].startswith('5.5')
          assert evidence['required_version_prefix'] == '5.5'
          migration = evidence['checks']['legacy_to_vnext_migration_rehearsal']
          assert migration['status'] == 'PASSED'
          migration_ready = migration['checks']['file_state_ready_gate']
          for run in ('first_run', 'second_run'):
              for project in ('fixture-a', 'fixture-b'):
                  assert migration_ready[run][project]['status'] == 'PASSED'
          PY
      - name: Upload MariaDB 5.5 compatibility evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: mariadb55-compatibility-evidence
          path: |
            .artifacts/mariadb55_compatibility.json
            .artifacts/mariadb55_py36_compatibility.json
            .artifacts/mariadb55_py36_compatibility.stderr
          if-no-files-found: error

  verified-production-mariadb55:
    name: Verified production backup rehearsal (MariaDB 5.5)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.production_backup_path != '' }}
    runs-on: [self-hosted, production-rehearsal]
    environment: production-rehearsal
    outputs:
      candidate_commit_sha: ${{ steps.production_identity.outputs.candidate_commit_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Run fail-closed verified-backup rehearsal
        env:
          REHEARSAL_CONFIG: ${{ inputs.production_rehearsal_config }}
          PRODUCTION_BACKUP: ${{ inputs.production_backup_path }}
          BACKUP_MANIFEST: ${{ inputs.production_backup_manifest }}
        run: |
          set -eu
          test -n "$REHEARSAL_CONFIG"
          test -n "$PRODUCTION_BACKUP"
          test -n "$BACKUP_MANIFEST"
          test -f "$REHEARSAL_CONFIG"
          test -f "$PRODUCTION_BACKUP"
          test -f "$BACKUP_MANIFEST"
          mkdir -p .artifacts/verified-production-mariadb55
          python scripts/upgrade/run_verified_backup_rehearsal.py \
            --repo-root "$PWD" \
            --config "$REHEARSAL_CONFIG" \
            --backup "$PRODUCTION_BACKUP" \
            --backup-manifest "$BACKUP_MANIFEST" \
            --require-version-prefix 5.5 \
            --create-disposable \
            --output .artifacts/verified-production-mariadb55/rehearsal.json \
            --manifest-output .artifacts/verified-production-mariadb55/evidence-manifest-v2.json
      - name: Verify exact-SHA production rehearsal evidence
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(Path(
              '.artifacts/verified-production-mariadb55/rehearsal.json'
          ).read_text(encoding='utf-8'))
          assert evidence['status'] == 'PASSED'
          assert evidence['synthetic'] is False
          assert evidence['candidate_revision'] == os.environ['EXPECTED_SHA']
          assert evidence['database_runtime_identity']['version'].startswith('5.5')
          assert evidence['semantic_hash_version'] == 'canonical-multiset-v2'
          assert evidence['source_component_hashes'] == evidence['target_component_hashes']
          assert evidence['semantic_mismatch_components'] == []
          assert evidence['checks']['authoritative_semantic_match'] is True
          assert evidence['checks']['migration_idempotent'] is True
          file_state = evidence['checks']['file_state_ready_gate']
          for run in ('first_run', 'second_run'):
              assert file_state[run]['status'] == 'PASSED'
              assert file_state[run]['project_count'] > 0
              for project in file_state[run]['projects'].values():
                  assert project['status'] == 'PASSED'
                  assert project['data_version'] == project['file_state_version']
                  assert project['gate']['completeness']['status'] == 'PASSED'
                  assert project['gate']['pending_conservation']['status'] == 'PASSED'
                  assert project['gate']['reconciliation']['status'] == 'PASSED'
          assert evidence['checks']['source_collation']['collation'] == 'utf8mb4_unicode_ci'
          assert evidence['checks']['target_collation']['collation'] == 'utf8mb4_general_ci'
          manifest = json.loads(Path(
              '.artifacts/verified-production-mariadb55/evidence-manifest-v2.json'
          ).read_text(encoding='utf-8'))
          assert manifest['evidence_schema_version'] == 2
          assert manifest['gate'] == 'gate-a'
          assert manifest['candidate_revision'] == os.environ['EXPECTED_SHA']
          assert manifest['release_identity']['commit_sha'] == os.environ['EXPECTED_SHA']
          assert manifest['database_runtime_identity']['version'].startswith('5.5')
          records = manifest['evidence']
          assert len(records) == 1
          assert records[0]['status'] == 'PASSED'
          assert records[0]['database_runtime_identity']['version'].startswith('5.5')
      - name: Expose exact backup source identity
        id: production_identity
        run: |
          python scripts/diagnostics/production_ready_evidence_join.py \
            --kind backup \
            --path .artifacts/verified-production-mariadb55/rehearsal.json \
            --github-output >> "$GITHUB_OUTPUT"
      - name: Upload verified production rehearsal evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: verified-production-mariadb55-${{ github.sha }}
          path: |
            .artifacts/verified-production-mariadb55/rehearsal.json
            .artifacts/verified-production-mariadb55/evidence-manifest-v2.json
          if-no-files-found: error

  py36-compat:
    name: Python 3.6 compatibility (VNext minimum behavior)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Compile changed runtime modules
        run: |
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace python@sha256:f8652afaf88c25f0d22354d547d892591067aa4026a7fa9a6819df9f300af6fc \
            bash -lc "find app scripts -type f -name '*.py' -print0 | xargs -0 python -m py_compile && python -m py_compile source_reader.py code_detail_service.py coverage_check.py enhance_coverage.py"
      - name: Run compatibility-focused tests
        run: |
          mkdir -p .artifacts
          set -o pipefail
          docker run --rm -i \
            -v "$PWD:/workspace" -w /workspace python@sha256:f8652afaf88c25f0d22354d547d892591067aa4026a7fa9a6819df9f300af6fc \
            bash -s <<'PY' 2>&1 | tee .artifacts/py36-compat.log
          set -e
          rm -f .artifacts/py36-runtime-evidence.json
          python -m pip install --no-cache-dir -r requirements-py36.txt
          python -c "import pymysql; assert pymysql.__version__ == '0.10.1', pymysql.__version__"
          python -m unittest \
            tests.code_detail.test_phase2_core \
            tests.incremental.test_phase5_inject_path \
            tests.vnext.test_api_export_security \
            tests.vnext.test_analysis_domain \
            tests.vnext.test_jobs \
            tests.vnext.test_migration_runner \
            tests.vnext.test_runtime_config \
            tests.vnext.test_vnext_runtime \
            tests.vnext.test_legacy_runtime_adapter \
            tests.vnext.test_reliability_repairs \
            tests.release.test_gate_matrix \
            tests.release.test_immutable_release_publication \
            tests.release.test_legacy_background_serialization \
            tests.release.test_validation_session \
            tests.release.test_verified_backup_rehearsal -v
          python - <<'PY_EVIDENCE'
          import json
          import pymysql
          import sys

          with open('.artifacts/py36-runtime-evidence.json', 'w') as stream:
              json.dump({
                  'status': 'PASSED',
                  'python': '{}.{}'.format(*sys.version_info[:2]),
                  'pymysql': pymysql.__version__,
                  'tests_executed': True,
              }, stream)
          PY_EVIDENCE
          PY
      - name: Verify Python 3.6 runtime evidence
        run: |
          test -s .artifacts/py36-runtime-evidence.json
          grep -q '"status": "PASSED"' .artifacts/py36-runtime-evidence.json
          grep -q '"python": "3.6' .artifacts/py36-runtime-evidence.json
          grep -q '"tests_executed": true' .artifacts/py36-runtime-evidence.json
          grep -q '"pymysql": "0.10.1"' .artifacts/py36-runtime-evidence.json
      - name: Isolate failing Python 3.6 compatibility module
        if: ${{ failure() }}
        run: |
          docker run --rm -i \
            -v "$PWD:/workspace" -w /workspace python@sha256:f8652afaf88c25f0d22354d547d892591067aa4026a7fa9a6819df9f300af6fc \
            bash -s <<'PY'
          set -e
          python -m pip install --no-cache-dir -r requirements-py36.txt
          python -c "import pymysql; assert pymysql.__version__ == '0.10.1', pymysql.__version__"
          set +e
          failed=0
          for test_module in \
            tests.code_detail.test_phase2_core \
            tests.incremental.test_phase5_inject_path \
            tests.vnext.test_api_export_security \
            tests.vnext.test_analysis_domain \
            tests.vnext.test_jobs \
            tests.vnext.test_migration_runner \
            tests.vnext.test_runtime_config \
            tests.vnext.test_vnext_runtime \
            tests.vnext.test_legacy_runtime_adapter \
            tests.vnext.test_reliability_repairs \
            tests.release.test_gate_matrix \
            tests.release.test_immutable_release_publication \
            tests.release.test_legacy_background_serialization \
            tests.release.test_validation_session \
            tests.release.test_verified_backup_rehearsal; do
            python -m unittest "$test_module" -v
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::error title=Python 3.6 module failure::$test_module exited with status $status"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Python 3.6 compatibility module isolation found one or more failures" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
          PY
      - name: Upload Python 3.6 compatibility log
        if: ${{ always() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: py36-compatibility-log
          path: |
            .artifacts/py36-compat.log
            .artifacts/py36-runtime-evidence.json
          if-no-files-found: error

  candidate-build:
    name: Trusted Candidate Build (manual protected lane)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_build == true }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: Chary-yu/fos_coverage_tool/.github/workflows/trusted-candidate-builder.yml@d8a04e68c227c5623e4983a56be53b7fc10ed93e
    with:
      source_sha: ${{ github.sha }}
      builder_workflow_sha: d8a04e68c227c5623e4983a56be53b7fc10ed93e
    secrets: inherit

  candidate-source-gate:
    name: Candidate source gate (required source lanes)
    if: ${{ always() }}
    needs:
      - semantic-migration-regression
      - mysql55-compatibility
      - py36-compat
      - specialist-regression
    runs-on: ubuntu-latest
    steps:
      - name: Require all Candidate source lanes to pass
        env:
          SEMANTIC_MIGRATION_RESULT: ${{ needs.semantic-migration-regression.result }}
          MYSQL55_RESULT: ${{ needs.mysql55-compatibility.result }}
          PY36_RESULT: ${{ needs.py36-compat.result }}
          SPECIALIST_RESULT: ${{ needs.specialist-regression.result }}
        run: |
          set -eu
          for result in \
            "semantic-migration-regression=$SEMANTIC_MIGRATION_RESULT" \
            "mysql55-compatibility=$MYSQL55_RESULT" \
            "py36-compat=$PY36_RESULT" \
            "specialist-regression=$SPECIALIST_RESULT"; do
            lane="${result%%=*}"
            status="${result#*=}"
            echo "$lane: $status"
            test "$status" = success
          done
          {
            echo "## Candidate Source Gate"
            echo "PASS — source lanes are green. This does not certify Production READY."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate source gate: PASS (Production READY requires manual external evidence)"

  mock-dom-regression:
    name: Mock DOM regression (not browser evidence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: node test_lazy_collapse_browser_smoke.js

  real-browser-e2e:
    name: Real browser fixture E2E (not Candidate evidence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run required real-browser and canonical VNext HTTP suites
        env:
          COVERAGE_CROSS_LAYER_OUTPUT: .artifacts/cross_layer_performance_fixture.json
        run: mkdir -p .artifacts && npx playwright test tests/browser --reporter=json > .artifacts/browser_playwright.json
      - run: mkdir -p .artifacts && npm run perf:synthetic-dom -- .artifacts/synthetic_dom_microbenchmark.json
      - name: Validate browser performance evidence boundary
        run: python scripts/diagnostics/performance_evidence_audit.py .artifacts/synthetic_dom_microbenchmark.json --allow-partial
      - name: Validate instrumented fixture metrics (not release evidence)
        run: >-
          python scripts/diagnostics/performance_evidence_audit.py
          .artifacts/cross_layer_performance_fixture.json --require-cross-layer
      - name: Upload browser functional evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: browser-functional-evidence
          path: |
            .artifacts/browser_playwright.json
            .artifacts/synthetic_dom_microbenchmark.json
            .artifacts/cross_layer_performance_fixture.json
          if-no-files-found: error

  cross-layer-performance:
    name: Cross-layer performance release evidence (browser artifact)
    # The producer is the real Candidate browser job below.  Hosted runners
    # are disposable, so this consumer must download the producer's immutable
    # evidence artifact rather than read an operator path from another host.
    needs:
      - real-browser-candidate
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.real_browser_url != '' }}
    runs-on: ubuntu-latest
    outputs:
      candidate_commit_sha: ${{ steps.production_identity.outputs.candidate_commit_sha }}
      candidate_artifact_sha256: ${{ steps.production_identity.outputs.candidate_artifact_sha256 }}
      served_root_sha256: ${{ steps.production_identity.outputs.served_root_sha256 }}
      release_validation_session_id: ${{ steps.production_identity.outputs.release_validation_session_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Download browser-produced immutable evidence package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: real-browser-candidate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/real-browser-candidate
      - name: Verify producer artifact digest
        env:
          EXPECTED_PERFORMANCE_EVIDENCE_SHA256: ${{ needs.real-browser-candidate.outputs.performance_evidence_sha256 }}
        run: |
          set -eu
          evidence=.artifacts/real-browser-candidate/performance-evidence.json
          test -s "$evidence"
          observed="$(sha256sum "$evidence" | awk '{print $1}')"
          test -n "$EXPECTED_PERFORMANCE_EVIDENCE_SHA256"
          test "$observed" = "$EXPECTED_PERFORMANCE_EVIDENCE_SHA256"
          EXPECTED_PERFORMANCE_EVIDENCE_SHA256="$EXPECTED_PERFORMANCE_EVIDENCE_SHA256" \
            OBSERVED_PERFORMANCE_EVIDENCE_SHA256="$observed" \
            python - <<'PY'
          import json
          import os
          with open('.artifacts/real-browser-candidate/transfer-manifest.json', 'w') as stream:
              json.dump({
                  'status': 'PASSED',
                  'producer_job': 'real-browser-candidate',
                  'artifact_name': 'real-browser-candidate-evidence-{}-{}'.format(
                      os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']),
                  'expected_performance_evidence_sha256': os.environ[
                      'EXPECTED_PERFORMANCE_EVIDENCE_SHA256'],
                  'observed_performance_evidence_sha256': os.environ[
                      'OBSERVED_PERFORMANCE_EVIDENCE_SHA256'],
              }, stream, indent=2, sort_keys=True)
              stream.write('\\n')
          PY
      - name: Require downloaded cross-layer metrics
        run: |
          set -o pipefail
          mkdir -p .artifacts/cross-layer-performance
          python scripts/diagnostics/performance_evidence_audit.py \
            .artifacts/real-browser-candidate/performance-evidence.json \
            --require-cross-layer \
            --require-release-eligible \
            | tee .artifacts/cross-layer-performance/cross_layer_performance.json
      - name: Expose exact cross-layer publication identity
        id: production_identity
        run: |
          python scripts/diagnostics/production_ready_evidence_join.py \
            --kind performance \
            --path .artifacts/real-browser-candidate/performance-evidence.json \
            --github-output >> "$GITHUB_OUTPUT"
      - name: Upload cross-layer performance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: cross-layer-performance-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/cross-layer-performance/cross_layer_performance.json
            .artifacts/real-browser-candidate/performance-evidence.json
            .artifacts/real-browser-candidate/transfer-manifest.json
          if-no-files-found: warn

  real-browser-candidate:
    name: Real Candidate browser evidence
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.real_browser_url != '' }}
    runs-on: ubuntu-latest
    outputs:
      candidate_commit_sha: ${{ steps.production_identity.outputs.candidate_commit_sha }}
      candidate_artifact_sha256: ${{ steps.production_identity.outputs.candidate_artifact_sha256 }}
      served_root_sha256: ${{ steps.production_identity.outputs.served_root_sha256 }}
      release_validation_session_id: ${{ steps.production_identity.outputs.release_validation_session_id }}
      performance_evidence_sha256: ${{ steps.performance_artifact.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Install browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Collect exact-SHA Candidate browser and performance evidence
        env:
          REAL_BROWSER_URL: ${{ inputs.real_browser_url }}
          REAL_BROWSER_EXPECTED_REVISION: ${{ inputs.real_browser_expected_revision || github.sha }}
          REAL_BROWSER_RELEASE_VALIDATION_SESSION_ID: ${{ inputs.real_browser_release_validation_session_id }}
          REAL_BROWSER_CANDIDATE_ARTIFACT_SHA256: ${{ inputs.real_browser_candidate_artifact_sha256 }}
          REAL_BROWSER_SERVED_ROOT_SHA256: ${{ inputs.real_browser_served_root_sha256 }}
          COVERAGE_BROWSER_USER: ${{ secrets.COVERAGE_BROWSER_USER }}
          COVERAGE_BROWSER_ROLE: ${{ secrets.COVERAGE_BROWSER_ROLE }}
        run: |
          set -o pipefail
          mkdir -p .artifacts/real-browser-candidate
          node scripts/diagnostics/real_browser_evidence.js \
            --url "$REAL_BROWSER_URL" \
            --expected-revision "$REAL_BROWSER_EXPECTED_REVISION" \
            --release-validation-session-id "$REAL_BROWSER_RELEASE_VALIDATION_SESSION_ID" \
            --candidate-artifact-sha256 "$REAL_BROWSER_CANDIDATE_ARTIFACT_SHA256" \
            --served-root-sha256 "$REAL_BROWSER_SERVED_ROOT_SHA256" \
            --header "X-Remote-User=$COVERAGE_BROWSER_USER" \
            --header "X-Remote-Role=${COVERAGE_BROWSER_ROLE:-reviewer}" \
            --output .artifacts/real-browser-candidate/workload.json \
            --browser-evidence-output .artifacts/real-browser-candidate/browser-evidence.json \
            --evidence-output .artifacts/real-browser-candidate/performance-evidence.json
      - name: Record immutable browser performance evidence digest
        id: performance_artifact
        run: |
          set -eu
          evidence=.artifacts/real-browser-candidate/performance-evidence.json
          test -s "$evidence"
          echo "sha256=$(sha256sum "$evidence" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Audit browser-produced cross-layer evidence
        run: |
          python scripts/diagnostics/performance_evidence_audit.py \
            .artifacts/real-browser-candidate/performance-evidence.json \
            --require-cross-layer --require-release-eligible
      - name: Expose browser-observed publication identity
        id: production_identity
        run: |
          python scripts/diagnostics/production_ready_evidence_join.py \
            --kind browser \
            --path .artifacts/real-browser-candidate/performance-evidence.json \
            --github-output >> "$GITHUB_OUTPUT"
      - name: Upload exact-SHA Candidate browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: real-browser-candidate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/real-browser-candidate
          if-no-files-found: error

  production-ready-gate:
    name: Production READY gate (manual external evidence)
    # This gate is intentionally absent from ordinary push/PR status.  It is
    # the explicit aggregator for production backup, real Candidate browser,
    # and release-eligible cross-layer performance evidence.  The
    # candidate-build job is a validation fixture lane; its role is checked
    # below so it can never silently certify Production READY.
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs:
      - candidate-source-gate
      - candidate-build
      - verified-production-mariadb55
      - real-browser-candidate
      - cross-layer-performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require all Production READY evidence lanes to pass
        env:
          SOURCE_RESULT: ${{ needs.candidate-source-gate.result }}
          CANDIDATE_BUILD_RESULT: ${{ needs.candidate-build.result }}
          BACKUP_RESULT: ${{ needs.verified-production-mariadb55.result }}
          BROWSER_RESULT: ${{ needs.real-browser-candidate.result }}
          PERFORMANCE_RESULT: ${{ needs.cross-layer-performance.result }}
          CANDIDATE_BUILD_COMMIT_SHA: ${{ needs.candidate-build.outputs.candidate_commit_sha }}
          CANDIDATE_BUILD_ARTIFACT_SHA256: ${{ needs.candidate-build.outputs.candidate_artifact_sha256 }}
          CANDIDATE_BUILD_ROLE: ${{ needs.candidate-build.outputs.artifact_role }}
          CANDIDATE_BUILD_PUBLISHABLE: ${{ needs.candidate-build.outputs.production_publishable }}
          CANDIDATE_BUILD_PROJECT: ${{ needs.candidate-build.outputs.project_name }}
          BACKUP_COMMIT_SHA: ${{ needs.verified-production-mariadb55.outputs.candidate_commit_sha }}
          BROWSER_COMMIT_SHA: ${{ needs.real-browser-candidate.outputs.candidate_commit_sha }}
          BROWSER_ARTIFACT_SHA256: ${{ needs.real-browser-candidate.outputs.candidate_artifact_sha256 }}
          BROWSER_SERVED_ROOT_SHA256: ${{ needs.real-browser-candidate.outputs.served_root_sha256 }}
          BROWSER_SESSION_ID: ${{ needs.real-browser-candidate.outputs.release_validation_session_id }}
          PERFORMANCE_COMMIT_SHA: ${{ needs.cross-layer-performance.outputs.candidate_commit_sha }}
          PERFORMANCE_ARTIFACT_SHA256: ${{ needs.cross-layer-performance.outputs.candidate_artifact_sha256 }}
          PERFORMANCE_SERVED_ROOT_SHA256: ${{ needs.cross-layer-performance.outputs.served_root_sha256 }}
          PERFORMANCE_SESSION_ID: ${{ needs.cross-layer-performance.outputs.release_validation_session_id }}
        run: |
          set -eu
          for result in \
            "candidate-source-gate=$SOURCE_RESULT" \
            "candidate-build=$CANDIDATE_BUILD_RESULT" \
            "verified-production-mariadb55=$BACKUP_RESULT" \
            "real-browser-candidate=$BROWSER_RESULT" \
            "cross-layer-performance=$PERFORMANCE_RESULT"; do
            lane="${result%%=*}"
            status="${result#*=}"
            echo "$lane: $status"
            test "$status" = success
          done
          mkdir -p .artifacts/production-ready
          python scripts/diagnostics/production_ready_evidence_join.py \
            --candidate-build-commit "$CANDIDATE_BUILD_COMMIT_SHA" \
            --candidate-build-artifact "$CANDIDATE_BUILD_ARTIFACT_SHA256" \
            --candidate-build-role "$CANDIDATE_BUILD_ROLE" \
            --candidate-build-publishable "$CANDIDATE_BUILD_PUBLISHABLE" \
            --candidate-build-project "$CANDIDATE_BUILD_PROJECT" \
            --browser-commit "$BROWSER_COMMIT_SHA" \
            --browser-artifact "$BROWSER_ARTIFACT_SHA256" \
            --browser-served-root "$BROWSER_SERVED_ROOT_SHA256" \
            --browser-session "$BROWSER_SESSION_ID" \
            --performance-commit "$PERFORMANCE_COMMIT_SHA" \
            --performance-artifact "$PERFORMANCE_ARTIFACT_SHA256" \
            --performance-served-root "$PERFORMANCE_SERVED_ROOT_SHA256" \
            --performance-session "$PERFORMANCE_SESSION_ID" \
            --backup-commit "$BACKUP_COMMIT_SHA" \
            --output .artifacts/production-ready/identity-join.json
          {
            echo "## Production READY Gate"
            echo "PASS — all manual evidence lanes passed and identify one exact Candidate publication."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Production READY gate: PASS (exact Candidate identity join)"
      - name: Upload Production READY identity join
        if: ${{ always() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: production-ready-identity-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/production-ready/identity-join.json
          if-no-files-found: warn
