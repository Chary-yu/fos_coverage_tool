name: CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**.py'
      - '**.js'
      - '**.sql'
      - '.github/workflows/ci.yml'
  push:
    paths:
      - '**.py'
      - '**.js'
      - '**.sql'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-py36.txt ]; then pip install -r requirements-py36.txt || true; fi
          pip install pymysql || true

      - name: Run Targeted Lazy Collapse Test Suite
        run: |
          python -m unittest test_lazy_collapse_v11_fixes.py test_lazy_collapse_e2e_and_perf.py test_code_region.py test_code_detail_service.py test_code_detail_api.py -v
      - name: Run VNext targeted test suite
        run: python -m unittest discover -s tests/vnext -p 'test_*.py' -v
      - name: Verify canonical runtime participation
        run: python scripts/diagnostics/runtime_participation_audit.py
      - name: Verify canonical ownership and asset parity
        run: python scripts/diagnostics/canonical_ownership_audit.py
      - name: Verify VNext legacy dependency boundary
        run: python scripts/diagnostics/runtime_legacy_dependency_audit.py

  py36-compat:
    name: Python 3.6 compatibility (changed runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.6'
      - name: Compile changed runtime modules
        run: |
          find app scripts -type f -name '*.py' -print0 | xargs -0 python -m py_compile
          python -m py_compile source_reader.py code_detail_service.py coverage_check.py enhance_coverage.py
      - name: Run compatibility-focused tests
        run: python -m unittest tests.code_detail.test_phase2_core tests.incremental.test_phase5_inject_path -v

  mock-dom-regression:
    name: Mock DOM regression (not browser evidence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: node test_lazy_collapse_browser_smoke.js

  real-browser-e2e:
    name: Real browser E2E
    if: ${{ vars.COVERAGE_ENABLE_REAL_BROWSER == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: mkdir -p .artifacts && npm run perf:browser-ab -- .artifacts/browser_perf_ab.json
