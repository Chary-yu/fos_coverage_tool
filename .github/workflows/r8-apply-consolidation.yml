name: R8 Source Consolidation Apply
# Triggered after workflow registration so the R8 apply job runs on this branch.

on:
  push:
    branches:
      - r8-source-consolidation-c0b88ceb
    paths:
      - '.r8/apply_consolidation.py'
      - '.github/workflows/r8-apply-consolidation.yml'

permissions:
  contents: write

jobs:
  apply:
    name: Apply and verify R8 source consolidation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: r8-source-consolidation-c0b88ceb

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: |
          python -m pip install --disable-pip-version-check -r requirements-py36.txt

      - name: Apply deterministic R8 source edits
        run: python .r8/apply_consolidation.py --apply

      - name: Run R8 targeted regressions only
        env:
          TERM: xterm
        run: |
          set -o pipefail
          python -m unittest \
            tests.database.test_disposable_target \
            tests.release.test_validation_session \
            tests.release.test_vfoswind_production_lifecycle \
            tests.release.test_upgrade_lifecycle \
            tests.release.test_upgrade_manifest \
            tests.release.test_evidence_authenticity \
            tests.release.test_r8_source_consolidation -v \
            2>&1 | tee /tmp/r8-targeted-tests.log

      - name: Verify Python 3.6 grammar and Python compile
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          paths = [
              Path('scripts/upgrade/disposable_target.py'),
              Path('scripts/upgrade/validation_session.py'),
              Path('scripts/upgrade/vfoswind_production_lifecycle.py'),
              Path('scripts/upgrade/run_upgrade.py'),
              Path('scripts/upgrade/evidence_manifest.py'),
              Path('scripts/diagnostics/mariadb55_candidate_grant_cleanup.py'),
              Path('scripts/diagnostics/upgrade_failure_summary.py'),
              Path('tests/database/test_disposable_target.py'),
              Path('tests/release/test_validation_session.py'),
              Path('tests/release/test_vfoswind_production_lifecycle.py'),
              Path('tests/release/test_upgrade_manifest.py'),
              Path('tests/release/test_evidence_authenticity.py'),
              Path('tests/release/test_r8_source_consolidation.py'),
          ]
          for path in paths:
              source = path.read_text(encoding='utf-8')
              ast.parse(source, filename=str(path), feature_version=(3, 6))
              compile(source, str(path), 'exec')
          print('R8 Python 3.6 grammar/compile gate: PASS')
          PY

      - name: Verify R7 defect shapes are absent
        run: |
          set -eu
          if grep -n 'REVOKE ALL PRIVILEGES' scripts/upgrade/disposable_target.py; then
            echo 'R7 unsupported revoke shape remains' >&2
            exit 1
          fi
          if grep -n -- '--value' scripts/upgrade/vfoswind_production_lifecycle.py; then
            echo 'systemd --value incompatibility remains' >&2
            exit 1
          fi
          if grep -n 'show_grants.output' scripts/upgrade/disposable_target.py; then
            echo 'raw SHOW GRANTS evidence write remains' >&2
            exit 1
          fi
          grep -q 'VALIDATION_PROCESS_EXITED' scripts/upgrade/run_upgrade.py
          grep -q 'candidate_schema_privileges_zero' scripts/upgrade/disposable_target.py
          grep -q 'captured_before_teardown' scripts/upgrade/run_upgrade.py

      - name: Commit verified R8 source consolidation
        run: |
          set -eu
          git rm -rf .r8
          git rm -f .github/workflows/r8-apply-consolidation.yml
          git add -A
          git diff --cached --check
          git config user.name 'R8 Source Consolidation'
          git config user.email 'r8-source-consolidation@users.noreply.github.com'
          git commit -m 'fix: consolidate R8 production upgrade safety'
          git push origin HEAD:r8-source-consolidation-c0b88ceb
