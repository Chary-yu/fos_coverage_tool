name: R8 SRC-022 apply patch once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact R8-SRC-022 patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum .github/r8-src-022.patch | awk '{print $1}')" = "b65161f550e7b59adad55484b4a0e654bbf00c65fd4e043b3a155099d247063d"
          git apply --check .github/r8-src-022.patch
          git apply .github/r8-src-022.patch
          python3 scripts/validate_release_gate_regressions.py
          python3 -m unittest tests.release.test_release_gate_mode tests.release.test_upgrade_manifest
          python3 - <<'PY'
          import ast
          for path in (
              'scripts/upgrade/release_gate_mode.py',
              'scripts/upgrade/run_upgrade.py',
          ):
              with open(path, 'r', encoding='utf-8') as stream:
                  ast.parse(stream.read(), filename=path, feature_version=(3, 6))
          print('PY36_GRAMMAR=PASS')
          PY
          git diff --check

      - name: Commit source fix and remove one-time files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/r8-src-022-pre-v3-report-mode-fix-once.yml
          rm -f .github/workflows/r8-src-022-apply-patch-once.yml
          rm -f .github/r8-src-022.patch
          git add -A
          git diff --cached --check
          git commit -m "fix: support pre-v3 report-mode gate classification"
          git push origin HEAD:main
