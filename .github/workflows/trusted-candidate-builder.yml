name: Trusted Candidate Builder

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source commit to build
        required: true
        type: string
      builder_workflow_sha:
        description: Immutable commit that contains this trusted builder workflow
        required: true
        type: string
    secrets:
      COVERAGE_BUILD_PROVENANCE_HMAC_KEY:
        # The protected job environment supplies this secret.  Keep the
        # declaration optional so environment-only secrets work when the
        # reusable workflow is called; the build step still hard-fails when
        # the environment secret is absent.
        required: false
    outputs:
      candidate_commit_sha:
        description: Exact commit used by the Candidate build
        value: ${{ jobs.build.outputs.candidate_commit_sha }}
      candidate_artifact_sha256:
        description: Exact Candidate artifact inventory SHA256
        value: ${{ jobs.build.outputs.candidate_artifact_sha256 }}
      build_workflow_sha:
        description: Immutable trusted builder workflow commit
        value: ${{ jobs.build.outputs.build_workflow_sha }}
      build_workflow_run_id:
        description: GitHub Actions workflow run ID
        value: ${{ jobs.build.outputs.build_workflow_run_id }}
      build_workflow_run_attempt:
        description: GitHub Actions workflow run attempt
        value: ${{ jobs.build.outputs.build_workflow_run_attempt }}
      artifact_role:
        description: Candidate artifact role; this builder emits validation fixtures only
        value: ${{ jobs.build.outputs.artifact_role }}
      production_publishable:
        description: Whether the Candidate may enter immutable production publication
        value: ${{ jobs.build.outputs.production_publishable }}
      project_name:
        description: Candidate project identity
        value: ${{ jobs.build.outputs.project_name }}
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit to build
        required: true
        type: string
      builder_workflow_sha:
        description: Immutable commit that contains this trusted builder workflow
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and attest exact Candidate artifact
    runs-on: ubuntu-latest
    environment: trusted-candidate-build
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      candidate_commit_sha: ${{ steps.metadata.outputs.candidate_commit_sha }}
      candidate_artifact_sha256: ${{ steps.metadata.outputs.candidate_artifact_sha256 }}
      build_workflow_sha: ${{ steps.metadata.outputs.build_workflow_sha }}
      build_workflow_run_id: ${{ steps.metadata.outputs.build_workflow_run_id }}
      build_workflow_run_attempt: ${{ steps.metadata.outputs.build_workflow_run_attempt }}
      artifact_role: ${{ steps.metadata.outputs.artifact_role }}
      production_publishable: ${{ steps.metadata.outputs.production_publishable }}
      project_name: ${{ steps.metadata.outputs.project_name }}
    env:
      BUILD_WORKFLOW_IDENTITY: github-actions/trusted-candidate-builder
      BUILD_WORKFLOW_RUN_ID: ${{ github.run_id }}
      BUILD_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
      BUILD_WORKFLOW_SHA: ${{ inputs.builder_workflow_sha }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      COVERAGE_BUILD_PROVENANCE_HMAC_KEY: ${{ secrets.COVERAGE_BUILD_PROVENANCE_HMAC_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact Candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          path: source

      - name: Checkout immutable builder workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.builder_workflow_sha }}
          fetch-depth: 0
          path: builder

      - name: Set up builder Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Verify exact source and builder checkouts
        run: |
          set -eu
          test -n "$SOURCE_SHA"
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git -C "$GITHUB_WORKSPACE/source" status --porcelain --untracked-files=all)"
          test -n "$BUILD_WORKFLOW_SHA"
          test "${#BUILD_WORKFLOW_SHA}" = 40
          test "$(git -C "$GITHUB_WORKSPACE/builder" rev-parse HEAD)" = "$BUILD_WORKFLOW_SHA"
          test -z "$(git -C "$GITHUB_WORKSPACE/builder" status --porcelain --untracked-files=all)"
          test -n "$BUILD_WORKFLOW_RUN_ID"
          test -n "$BUILD_WORKFLOW_RUN_ATTEMPT"

      - name: Build Candidate from exact source checkout
        run: |
          set -eu
          test -n "$COVERAGE_BUILD_PROVENANCE_HMAC_KEY"
          mkdir -p "$GITHUB_WORKSPACE/.artifacts/candidate-build"
          python "$GITHUB_WORKSPACE/builder/scripts/release/build_candidate_artifact.py" \
            --source-repo-root "$GITHUB_WORKSPACE/source" \
            --candidate-root "$GITHUB_WORKSPACE/.artifacts/candidate-build/candidate" \
            --release-identity-output "$GITHUB_WORKSPACE/.artifacts/candidate-build/release_identity.json" \
            --build-workflow-identity "$BUILD_WORKFLOW_IDENTITY" \
            --build-workflow-run-id "$BUILD_WORKFLOW_RUN_ID" \
            --build-workflow-run-attempt "$BUILD_WORKFLOW_RUN_ATTEMPT" \
            --build-workflow-sha "$BUILD_WORKFLOW_SHA" \
            | tee "$GITHUB_WORKSPACE/.artifacts/candidate-build/build.json"

      - name: Verify non-publishable validation Candidate contract
        run: |
          set -eu
          PYTHONPATH="$GITHUB_WORKSPACE/builder" python - <<'PY'
          import glob
          import json
          import os

          from app.candidate_artifact import CandidateArtifactManifest

          root = '.artifacts/candidate-build/candidate'
          with open('.artifacts/candidate-build/release_identity.json') as stream:
              identity = json.load(stream)
          manifest = CandidateArtifactManifest.verify(
              root, identity, candidate_sha=identity['commit_sha'],
              require_trusted_provenance=True,
          )
          assert manifest['artifact_sha256']
          assert manifest['artifact_role'] == 'validation_fixture'
          assert manifest['production_publishable'] is False
          assert manifest['project_name'] == 'Coverage Candidate'

          reports = []
          for directory, _, filenames in os.walk(os.path.join(root, 'reports')):
              for name in filenames:
                  if name.lower().endswith(('.html', '.htm')):
                      reports.append(os.path.join(directory, name))
          assert reports, 'validation Candidate must contain a Coverage report HTML file'
          vnext_reports = []
          for path in reports:
              with open(path, encoding='utf-8') as stream:
                  html = stream.read()
              if ('coverage-report-mode" content="VNEXT_ARTIFACT_READY"' in html
                      and '<pre class="source"></pre>' in html
                      and 'src="coverage_enhance.js"' in html
                      and 'href="coverage_enhance.css"' in html):
                  vnext_reports.append(path)
          assert vnext_reports, (
              'validation Candidate must contain a VNext report with the canonical browser shell'
          )

          sidecar_meta = []
          for path in glob.glob(
                  os.path.join(root, 'reports', '.source_cache', '**', 'meta.json'),
                  recursive=True):
              with open(path, encoding='utf-8') as stream:
                  sidecar_meta.append(json.load(stream))
          assert any(
              int(meta.get('schema_version') or 0) == 2
              and int(meta.get('total_lines') or 0) == 100000
              and any(
                  int(item.get('start_line') or 0) == 1
                  and int(item.get('end_line') or 0) == 100000
                  for item in (meta.get('function_ranges') or [])
              )
              for meta in sidecar_meta
          ), 'validation Candidate must contain the 100000-line VNext code region'
          PY

      - name: Create GitHub artifact attestation for Candidate manifest
        id: candidate_attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .artifacts/candidate-build/candidate/candidate_artifact_manifest.json

      - name: Persist external attestation bundle
        run: |
          set -eu
          test -n "${{ steps.candidate_attestation.outputs.bundle-path }}"
          test -s "${{ steps.candidate_attestation.outputs.bundle-path }}"
          cp "${{ steps.candidate_attestation.outputs.bundle-path }}" \
            "$GITHUB_WORKSPACE/.artifacts/candidate-build/candidate_build_attestation.bundle.json"

      - name: Sign protected Candidate build receipt
        run: |
          set -eu
          python "$GITHUB_WORKSPACE/builder/scripts/release/sign_candidate_build_receipt.py" \
            --candidate-root "$GITHUB_WORKSPACE/.artifacts/candidate-build/candidate" \
            --release-identity "$GITHUB_WORKSPACE/.artifacts/candidate-build/release_identity.json" \
            --source-repo-root "$GITHUB_WORKSPACE/source" \
            --build-workflow-identity "$BUILD_WORKFLOW_IDENTITY" \
            --build-workflow-run-id "$BUILD_WORKFLOW_RUN_ID" \
            --build-workflow-run-attempt "$BUILD_WORKFLOW_RUN_ATTEMPT" \
            --build-workflow-sha "$BUILD_WORKFLOW_SHA" \
            --attestation-bundle "$GITHUB_WORKSPACE/.artifacts/candidate-build/candidate_build_attestation.bundle.json" \
            --receipt-output "$GITHUB_WORKSPACE/.artifacts/candidate-build/candidate/candidate_build_receipt.json" \
            | tee "$GITHUB_WORKSPACE/.artifacts/candidate-build/receipt.json"

      - name: Verify attestation, receipt, and source binding
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/builder" python - <<'PY'
          import json
          from app.candidate_artifact import CandidateArtifactManifest
          from app.candidate_build_receipt import verify_candidate_build_receipt

          root = '.artifacts/candidate-build/candidate'
          with open('.artifacts/candidate-build/release_identity.json') as stream:
              identity = json.load(stream)
          manifest = CandidateArtifactManifest.verify(
              root, identity, candidate_sha=identity['commit_sha'],
              require_trusted_provenance=True,
          )
          result = verify_candidate_build_receipt(
              root, identity, manifest,
              '.artifacts/candidate-build/candidate_build_attestation.bundle.json',
              attestation_repository='Chary-yu/fos_coverage_tool',
              attestation_workflow=(
                  'Chary-yu/fos_coverage_tool/'
                  '.github/workflows/trusted-candidate-builder.yml'
              ),
          )
          assert result['status'] == 'PASSED'
          assert result['workflow_run_id'] == manifest['build_workflow_run_id']
          assert result['workflow_run_attempt'] == manifest['build_workflow_run_attempt']
          PY

      - name: Expose exact Candidate build identity
        id: metadata
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open('.artifacts/candidate-build/candidate/candidate_artifact_manifest.json') as stream:
              manifest = json.load(stream)
          print('candidate_commit_sha={}'.format(manifest['commit_sha']))
          print('candidate_artifact_sha256={}'.format(manifest['artifact_sha256']))
          print('build_workflow_sha={}'.format(manifest['build_workflow_sha']))
          print('build_workflow_run_id={}'.format(manifest['build_workflow_run_id']))
          print('build_workflow_run_attempt={}'.format(
              manifest['build_workflow_run_attempt']))
          print('artifact_role={}'.format(manifest['artifact_role']))
          print('production_publishable={}'.format(
              str(manifest['production_publishable']).lower()))
          print('project_name={}'.format(manifest['project_name']))
          PY

      - name: Upload immutable trusted Candidate build evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: trusted-candidate-build-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/candidate-build
          if-no-files-found: error
