name: R8 SRC-023 app bundle replacement once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Apply deterministic source and regression-test fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit('{} replacement count={} expected=1'.format(path, text.count(old)))
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'scripts/release/build_production_candidate_artifact.py',
              '''from app.release_publication import (\n    build_release_manifest, copy_production_application_bundle,\n    validate_production_application_bundle,\n    validate_production_candidate_content, current_served_root_binding,\n)''',
              '''from app.release_publication import (\n    PRODUCTION_APPLICATION_BUNDLE_DIRECTORY, build_release_manifest,\n    copy_production_application_bundle, validate_production_application_bundle,\n    validate_production_candidate_content, current_served_root_binding,\n)''',
          )

          replace_once(
              'scripts/release/build_production_candidate_artifact.py',
              '''    for name in sorted(os.listdir(served_root)):\n        if name in _CONTROL_FILES:\n            continue\n''',
              '''    for name in sorted(os.listdir(served_root)):\n        if name in _CONTROL_FILES or \\\n                name == PRODUCTION_APPLICATION_BUNDLE_DIRECTORY:\n            # CURRENT/app belongs to the previous release.  The Candidate\n            # runtime must come only from the pinned target source checkout.\n            continue\n''',
          )

          marker = '''    def test_offline_builder_emits_operator_evidence_without_ci_fields(self):\n'''
          insertion = '''    def test_builder_replaces_previous_application_bundle_from_target_source(self):\n        with tempfile.TemporaryDirectory(\n                prefix="production-candidate-app-replace-") as root:\n            source = os.path.join(root, "source")\n            candidate = os.path.join(root, "production-candidate")\n            os.makedirs(source)\n            self._source_repo(source)\n            served, _ = self._current_served_root(\n                root,\n                extra_files=(\n                    ("app/enhance_coverage.py", "old application"),\n                    ("app/stale_previous_release.txt", "stale"),\n                ),\n            )\n            result = build_production_candidate(\n                served, source, candidate, os.path.join(root, "identity.json"),\n                *self._provenance_args(),\n                **self._expected_binding_kwargs(served)\n            )\n            self.assertEqual(result["status"], "PASSED")\n            self.assertFalse(os.path.exists(os.path.join(\n                candidate, "app", "stale_previous_release.txt"\n            )))\n            with open(os.path.join(\n                    candidate, "app", "enhance_coverage.py"), "rb") as stream:\n                candidate_entrypoint = stream.read()\n            with open(os.path.join(source, "enhance_coverage.py"), "rb") as stream:\n                source_entrypoint = stream.read()\n            self.assertEqual(candidate_entrypoint, source_entrypoint)\n\n'''
          replace_once(
              'tests/release/test_production_candidate_build.py',
              marker,
              insertion + marker,
          )
          PY

          git diff --check

      - name: Run targeted release tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_release_gate_regressions.py
          python3 -m unittest \
            tests.release.test_production_candidate_build \
            tests.release.test_current_adoption \
            tests.release.test_bootstrap_previous_release \
            tests.release.test_vfoswind_production_lifecycle
          python3 - <<'PY'
          import ast
          path = 'scripts/release/build_production_candidate_artifact.py'
          with open(path, 'r', encoding='utf-8') as stream:
              ast.parse(stream.read(), filename=path, feature_version=(3, 6))
          print('PY36_GRAMMAR=PASS')
          PY

      - name: Commit source fix and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/r8-src-023-app-bundle-replacement-once.yml
          git add -A
          git diff --cached --check
          git commit -m "fix: replace previous release app bundle in production candidate"
          git push origin HEAD:main
