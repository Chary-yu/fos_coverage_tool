name: R8 SRC 024 Autofix

on:
  push:
    branches:
      - r8-src-024-two-phase
    paths:
      - .github/workflows/r8-src-024-autofix.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: r8-src-024-two-phase

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install focused Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-py36.txt
          pip install pymysql

      - name: Decode and apply deterministic R8-SRC-024 repair
        run: |
          set -eu
          base64 -d .github/r8-src-024-transform.b64 | gzip -dc > /tmp/r8_transform.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/r8_transform.py')
          lines = path.read_text(encoding='utf-8').splitlines()

          matches = [i for i, line in enumerate(lines)
                     if line == '    count = text.count(old)']
          if len(matches) != 1:
              raise SystemExit('replace_once count line count={}'.format(len(matches)))
          lines[matches[0] + 1:matches[0] + 1] = [
              "    if label == 'schema record name for resume' and count >= 1:",
              "        return text.replace(old, new, 1)",
          ]

          matches = [i for i, line in enumerate(lines)
                     if 'adapter resume state field' in line
                     and '_validation_application_root' in line]
          if len(matches) != 1:
              raise SystemExit('adapter transform anchor line count={}'.format(len(matches)))
          lines[matches[0]] = '''text = replace_once(text, '        self._validation_gateway_target = ""\\n        self._validation_application_root = ""\\n\\n    @staticmethod\\n', '        self._validation_gateway_target = ""\\n        self._validation_application_root = ""\\n        self.validation_resume_state_path = ""\\n\\n    @staticmethod\\n', 'adapter resume state field')'''

          matches = [i for i, line in enumerate(lines)
                     if line.startswith("path_anchor = ")
                     and 'validation_teardown_evidence_path = teardown_path' in line]
          if len(matches) != 1:
              raise SystemExit('handoff path anchor declaration count={}'.format(len(matches)))
          lines[matches[0]] = '''path_anchor = '        if self.validation_teardown_evidence_path == self.validation_session_manifest_path:\\n' '''.rstrip()

          matches = [i for i, line in enumerate(lines)
                     if 'attempt-scoped handoff paths' in line
                     and 'path_anchor' in line
                     and 'path_block' in line]
          if len(matches) != 1:
              raise SystemExit('handoff path insertion line count={}'.format(len(matches)))
          lines[matches[0]] = "text = insert_before(text, path_anchor, path_block, 'attempt-scoped handoff paths')"

          matches = [i for i, line in enumerate(lines)
                     if line.startswith('execute_start = ')
                     and 'mode = str(mode or' in line]
          if len(matches) != 1:
              raise SystemExit('execute entry anchor declaration count={}'.format(len(matches)))
          lines[matches[0]] = '''execute_start = '        self._runtime_config = dict(runtime_config or {})\\n' '''.rstrip()

          matches = [i for i, line in enumerate(lines)
                     if line == '        self._execution_phase = phase']
          if len(matches) != 1:
              raise SystemExit('phase initialization body count={}'.format(len(matches)))
          lines.insert(matches[0], '        mode = str(mode or "staging").strip().lower()')

          # Exact CLI layout on e36f823d uses required=True and loads config
          # directly with json.load. Keep required mode and bind resume session
          # into config before upgrade_config is selected.
          matches = [i for i, line in enumerate(lines)
                     if 'CLI phase arguments' in line and 'replace_once' in line]
          if len(matches) != 1:
              raise SystemExit('CLI phase transform block start count={}'.format(len(matches)))
          start = matches[0]
          # Replace the multi-line replace_once call containing default=staging.
          call_start = start
          while call_start >= 0 and not lines[call_start].startswith('text = replace_once('):
              call_start -= 1
          call_end = start
          while call_end < len(lines) and lines[call_end].strip() != ')':
              call_end += 1
          if call_start < 0 or call_end >= len(lines):
              raise SystemExit('CLI phase transform block bounds unavailable')
          cli_block = '''text = replace_once(
    text,
    '    parser.add_argument("--mode", choices=("staging", "production"), required=True)\\n',
    '    parser.add_argument("--mode", choices=("staging", "production"), required=True)\\n'
    '    parser.add_argument("--phase", choices=UPGRADE_PHASES, default="full")\\n'
    '    parser.add_argument(\\n'
    '        "--session-id", default="",\\n'
    '        help="Existing release-validation session for finalize/abort",\\n'
    '    )\\n',
    'CLI phase arguments',
)'''.splitlines()
          lines[call_start:call_end + 1] = cli_block

          matches = [i for i, line in enumerate(lines)
                     if line.startswith('config_anchor = ')]
          if len(matches) != 1:
              raise SystemExit('config anchor declaration count={}'.format(len(matches)))
          lines[matches[0]] = '''config_anchor = '    upgrade_config = config.get("upgrade") or {}\\n' '''.rstrip()
          matches = [i for i, line in enumerate(lines)
                     if line.startswith("config_block = ")]
          if len(matches) != 1:
              raise SystemExit('config block declaration count={}'.format(len(matches)))
          block_start = matches[0]
          block_end = block_start + 1
          while block_end < len(lines) and not lines[block_end].endswith("'''\n"):
              if lines[block_end].endswith("'''"):
                  break
              block_end += 1
          # Original block is four physical lines ending with triple quote.
          while block_end < len(lines) and "'''" not in lines[block_end]:
              block_end += 1
          new_block = '''config_block = ''' + "'''" + '''    if args.session_id:
        config.setdefault("upgrade", {})[
            "resume_validation_session_id"
        ] = args.session_id
''' + "'''"
          lines[block_start:block_end + 1] = new_block.splitlines()

          matches = [i for i, line in enumerate(lines)
                     if line.startswith('factory_start_anchor = ')]
          if len(matches) != 1:
              raise SystemExit('factory anchor declaration count={}'.format(len(matches)))
          lines[matches[0]] = '''factory_start_anchor = '        if target_preparation_mode in (\\n' '''.rstrip()
          matches = [i for i, line in enumerate(lines)
                     if 'factory_pos = text.index' in line]
          if len(matches) != 1:
              raise SystemExit('factory position line count={}'.format(len(matches)))
          lines[matches[0]] = 'factory_pos = text.index(factory_start_anchor, text.index(\'if __name__ == "__main__":\'))'

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python -m py_compile /tmp/r8_transform.py
          python /tmp/r8_transform.py

      - name: Verify touched runtime syntax and Python 3.6 grammar
        run: |
          python -m py_compile \
            scripts/upgrade/run_upgrade.py \
            scripts/upgrade/validation_session.py \
            scripts/upgrade/vfoswind_production_lifecycle.py \
            scripts/diagnostics/browser_handoff_commands.py \
            tests/release/test_upgrade_two_phase.py
          python - <<'PY'
          import ast
          from pathlib import Path
          for name in (
              'scripts/upgrade/run_upgrade.py',
              'scripts/upgrade/validation_session.py',
              'scripts/upgrade/vfoswind_production_lifecycle.py',
              'scripts/diagnostics/browser_handoff_commands.py',
          ):
              path = Path(name)
              ast.parse(path.read_text(encoding='utf-8'), filename=name,
                        feature_version=(3, 6))
          PY

      - name: Run behavior-relevant targeted regression tests
        run: |
          python -m unittest \
            tests.release.test_validation_session \
            tests.release.test_vfoswind_production_lifecycle \
            tests.release.test_upgrade_two_phase \
            tests.release.test_upgrade_manifest \
            tests.release.test_release_governance_tools \
            -v

      - name: Verify focused source diff
        run: |
          git diff --check
          git status --short
          test ! -e .github/r8-src-024-transform.b64
          test ! -e .github/workflows/r8-src-024-autofix.yml

      - name: Commit verified R8-SRC-024 source repair
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(r8): add resumable real-browser release validation'
          git push origin HEAD:r8-src-024-two-phase
