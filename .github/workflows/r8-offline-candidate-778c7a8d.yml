name: R8 Offline Candidate 778c7a8d

on:
  push:
    branches:
      - r8-offline-candidate-778c7a8d-20260914

permissions:
  contents: read

env:
  TARGET_SHA: 778c7a8da3ef365c9d2424cf7006120c8c419253
  BASELINE_SHA: e9fcc837a1ac9847f3966fc8ddb2aed92ca473fc

jobs:
  build-offline-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tool repository with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Verify exact source identities
        run: |
          set -euo pipefail
          git cat-file -e "${TARGET_SHA}^{commit}"
          git cat-file -e "${BASELINE_SHA}^{commit}"
          mkdir -p .artifacts .worktrees
          git worktree add --detach .worktrees/target "${TARGET_SHA}"
          git worktree add --detach .worktrees/baseline "${BASELINE_SHA}"
          test "$(git -C .worktrees/target rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git -C .worktrees/baseline rev-parse HEAD)" = "${BASELINE_SHA}"
          test -z "$(git -C .worktrees/target status --porcelain --untracked-files=all)"
          git -C .worktrees/target rev-parse 'HEAD^{tree}' > .artifacts/final.tree
      - name: Run targeted vfoswind readiness regression
        run: python -m unittest tests.release.test_vfoswind_attempt_config -v
        working-directory: .worktrees/target
      - name: Build exact offline Git bundle
        run: |
          set -euo pipefail
          git branch -f r8-bundle-final "${TARGET_SHA}"
          git branch -f r8-bundle-baseline "${BASELINE_SHA}"
          git bundle create .artifacts/source.bundle refs/heads/r8-bundle-final refs/heads/r8-bundle-baseline
          git bundle verify .artifacts/source.bundle
          sha256sum .artifacts/source.bundle > .artifacts/source.bundle.sha256
      - name: Install pinned browser dependencies
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
      - name: Generate exact baseline and Candidate performance evidence
        run: |
          set -euo pipefail
          TARGET_TREE="$(cat .artifacts/final.tree)"
          BASE_TREE="$(git -C .worktrees/baseline rev-parse 'HEAD^{tree}')"
          node scripts/diagnostics/release_performance_revision.js --source-root .worktrees/baseline --expected-revision "${BASELINE_SHA}" --expected-tree "${BASE_TREE}" --output .artifacts/baseline-performance.json
          node scripts/diagnostics/release_performance_revision.js --source-root .worktrees/target --expected-revision "${TARGET_SHA}" --expected-tree "${TARGET_TREE}" --output .artifacts/candidate-performance.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('.artifacts/baseline-performance.json').read_text())
          Path('.artifacts/workload.hash').write_text(payload['workload_hash'] + '\n')
          PY
      - name: Generate exact one-click offline handoff
        run: |
          set -euo pipefail
          TARGET_TREE="$(cat .artifacts/final.tree)"
          WORKLOAD_HASH="$(cat .artifacts/workload.hash)"
          cat > .artifacts/release-metadata.json <<EOF
          {
            "repository": "Chary-yu/fos_coverage_tool",
            "production_host": "vfoswind",
            "final_r8_sha": "${TARGET_SHA}",
            "final_r8_tree": "${TARGET_TREE}",
            "production_baseline_sha": "${BASELINE_SHA}",
            "workload_hash": "${WORKLOAD_HASH}",
            "performance_max_regression_percent": 20
          }
          EOF
          python .worktrees/target/scripts/release/build_oneclick_release.py --repo-root .worktrees/target --final-sha "${TARGET_SHA}" --final-tree "${TARGET_TREE}" --baseline-sha "${BASELINE_SHA}" --source-bundle "$PWD/.artifacts/source.bundle" --baseline-performance "$PWD/.artifacts/baseline-performance.json" --candidate-performance "$PWD/.artifacts/candidate-performance.json" --workload-hash "${WORKLOAD_HASH}" --metadata "$PWD/.artifacts/release-metadata.json" --output "$PWD/.artifacts/fos_r8_oneclick_release_778c7a8d_20260914.txt" | tee .artifacts/generation-result.json
          sha256sum .artifacts/fos_r8_oneclick_release_778c7a8d_20260914.txt > .artifacts/fos_r8_oneclick_release_778c7a8d_20260914.txt.sha256
      - name: Validate generated handoff and exact bundle
        run: |
          set -euo pipefail
          python .worktrees/target/scripts/validate_release_orchestration.py --repo-root .worktrees/target --tool "$PWD/.artifacts/fos_r8_oneclick_release_778c7a8d_20260914.txt" --bundle "$PWD/.artifacts/source.bundle" --output "$PWD/.artifacts/offline-handoff-validation.json"
      - name: Upload offline Candidate handoff
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: fos-r8-offline-candidate-778c7a8d-20260914
          path: .artifacts
          if-no-files-found: error
          retention-days: 30
