<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coverage Analysis Progress</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --line: #d8e0ea;
      --text: #172033;
      --muted: #64748b;
      --head: #eef3f8;
      --blue: #1f5fbf;
      --green: #1f9d55;
      --red: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "Microsoft YaHei", sans-serif;
    }
    header {
      padding: 18px 24px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 22px;
      line-height: 1.2;
    }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    input {
      width: min(420px, 100%);
      height: 34px;
      border: 1px solid #bcc7d4;
      border-radius: 4px;
      padding: 0 10px;
      font-size: 14px;
    }
    button, a.button {
      height: 34px;
      border: 1px solid #c7d8ff;
      border-radius: 4px;
      background: #eef4ff;
      color: var(--blue);
      padding: 0 12px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    button:hover, a.button:hover { background: #dfeaff; }
    main { padding: 18px 24px 32px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
    }
    .label { color: var(--muted); font-size: 12px; }
    .value { font-size: 24px; font-weight: 800; margin-top: 4px; }
    .section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      margin-top: 14px;
      overflow: hidden;
    }
    .section h2 {
      margin: 0;
      padding: 10px 12px;
      font-size: 15px;
      background: var(--head);
      border-bottom: 1px solid var(--line);
    }
    .table-wrap { overflow: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 920px;
    }
    th, td {
      border-bottom: 1px solid #e7edf4;
      padding: 7px 8px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #f8fafc;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    td.path { word-break: break-all; }
    .bar {
      display: inline-block;
      width: 90px;
      height: 8px;
      background: #e5e7eb;
      border-radius: 4px;
      overflow: hidden;
      margin-left: 8px;
      vertical-align: middle;
    }
    .bar span { display: block; height: 100%; background: var(--green); }
    .status {
      margin-top: 10px;
      color: var(--muted);
    }
    .error { color: var(--red); }
    @media (max-width: 900px) {
      .cards { grid-template-columns: repeat(2, minmax(150px, 1fr)); }
    }
  </style>
</head>
<body>
  <header>
    <h1 id="pageTitle">全量覆盖率分析进度</h1>
    <div class="controls">
      <input id="projectInput" placeholder="输入项目名，例如 review_v6r2_202605">
      <button id="loadBtn" type="button">查看进度</button>
      <a id="csvLink" class="button" href="#" target="_blank">导出进度 Excel</a>
      <a id="excelLink" class="button" href="#" target="_blank">导出目录 Excel ZIP</a>
    </div>
    <div id="status" class="status"></div>
  </header>
  <main>
    <div class="cards">
      <div class="card"><div id="totalUncoveredLabel" class="label">未覆盖行总数</div><div id="totalUncovered" class="value">-</div></div>
      <div class="card"><div class="label">已填写</div><div id="filledTotal" class="value">-</div></div>
      <div class="card"><div class="label">填写率</div><div id="fillRate" class="value">-</div></div>
      <div class="card"><div class="label">确认率</div><div id="confirmedRate" class="value">-</div></div>
    </div>
    <section class="section">
      <h2>目录进度</h2>
      <div class="table-wrap"><table id="dirTable"></table></div>
    </section>
    <section class="section">
      <h2>文件进度</h2>
      <div class="table-wrap"><table id="fileTable"></table></div>
    </section>
  </main>
  <script>
    const DEFAULT_REVIEW_SCOPE = 'full'; // 'full' or 'incremental'
    const params = new URLSearchParams(window.location.search);
    const reviewScope = params.get('scope') === 'incremental' ? 'incremental' : DEFAULT_REVIEW_SCOPE;
    const projectInput = document.getElementById('projectInput');
    const statusEl = document.getElementById('status');
    const csvLink = document.getElementById('csvLink');
    const excelLink = document.getElementById('excelLink');
    let resolvedApiBase = '';

    if (reviewScope === 'incremental') {
      document.title = 'Incremental Coverage Analysis Progress';
      document.getElementById('pageTitle').innerText = '增量覆盖率分析进度';
      document.getElementById('totalUncoveredLabel').innerText = '增量未覆盖行';
    }

    projectInput.value = params.get('project') || '';

    function asNumber(value) {
      const num = Number(value);
      return Number.isFinite(num) ? num : 0;
    }

    function fmtRate(value) {
      const num = Number(value);
      return Number.isFinite(num) ? `${num.toFixed(1)}%` : '0.0%';
    }

    function bar(rate) {
      const value = Math.max(0, Math.min(100, asNumber(rate)));
      return `<span class="bar"><span style="width:${value}%"></span></span>`;
    }

    function metric(id, value) {
      document.getElementById(id).innerText = value;
    }

    function tableRows(rows, pathKey) {
      if (!rows || rows.length === 0) {
        return '<tr><td>暂无数据</td></tr>';
      }
      return rows.map(row => `
        <tr>
          <td class="path">${row[pathKey] || '(root)'}</td>
          <td>${asNumber(row.total_uncovered)}</td>
          <td>${asNumber(row.filled_total)}</td>
          <td>${asNumber(row.unfilled_total)}</td>
          <td>${asNumber(row.confirmed_total)}</td>
          <td>${asNumber(row.coverable_total)}</td>
          <td>${asNumber(row.uncoverable_total)}</td>
          <td>${asNumber(row.redundant_total)}</td>
          <td>${fmtRate(row.fill_rate)} ${bar(row.fill_rate)}</td>
          <td>${fmtRate(row.confirmed_rate)} ${bar(row.confirmed_rate)}</td>
        </tr>
      `).join('');
    }

    function renderTable(id, rows, pathKey) {
      document.getElementById(id).innerHTML = `
        <thead>
          <tr>
            <th>路径</th><th>未覆盖</th><th>已填</th><th>未填</th><th>已确认</th>
            <th>可覆盖</th><th>无法覆盖</th><th>冗余</th><th>填写率</th><th>确认率</th>
          </tr>
        </thead>
        <tbody>${tableRows(rows, pathKey)}</tbody>
      `;
    }

    function normalizeApiBase(value) {
      return String(value || '').replace(/\/+$/, '');
    }

    function unique(values) {
      return Array.from(new Set(values.filter(Boolean)));
    }

    function apiBaseCandidates() {
      const explicit = params.get('api');
      const origin = window.location.origin && window.location.origin !== 'null' ? window.location.origin : '';
      const candidates = [];
      if (explicit) {
        candidates.push(normalizeApiBase(explicit));
      }
      if (origin) {
        candidates.push(`${origin}/api/coverage`);
        if (window.location.pathname.startsWith('/coverage/')) {
          candidates.push(`${origin}/coverage/api/coverage`);
        }
        if (window.location.port !== '9528') {
          candidates.push(`${window.location.protocol}//${window.location.hostname}:9528/api/coverage`);
        }
      }
      candidates.push('http://127.0.0.1:9528/api/coverage');
      candidates.push('/api/coverage');
      return unique(candidates.map(normalizeApiBase));
    }

    function fetchJsonWithTimeout(url, timeoutMs) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      return fetch(url, { signal: controller.signal })
        .finally(() => clearTimeout(timer))
        .then(response => {
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          return response.json();
        });
    }

    function updateLinks(project, apiBase) {
      const encoded = encodeURIComponent(project);
      const base = normalizeApiBase(apiBase || resolvedApiBase || apiBaseCandidates()[0]);
      csvLink.href = `${base}/export?type=full_progress_summary&project=${encoded}`;
      excelLink.href = `${base}/export?type=review_excel_by_dir&project=${encoded}`;
    }

    async function loadProgress() {
      const project = projectInput.value.trim();
      if (!project) {
        statusEl.innerHTML = '<span class="error">请输入项目名。</span>';
        return;
      }
      const loadBtn = document.getElementById('loadBtn');
      loadBtn.disabled = true;
      loadBtn.innerText = '正在加载...';

      const encodedProject = encodeURIComponent(project);
      const candidates = apiBaseCandidates();
      updateLinks(project, candidates[0]);
      statusEl.innerText = `正在连接接口：${candidates[0]}`;
      let lastError = null;

      try {
        for (const apiBase of candidates) {
          try {
            statusEl.innerText = `正在加载：${apiBase}`;
            const payload = await fetchJsonWithTimeout(`${apiBase}/progress?project=${encodedProject}`, 15000);
            if (!payload || payload.status !== 'success') {
              throw new Error(payload && payload.message ? payload.message : '加载失败');
            }
            resolvedApiBase = apiBase;
            updateLinks(project, apiBase);
            const data = payload.data || {}, projectRow = (data.project && data.project[0]) || {};
            metric('totalUncovered', asNumber(projectRow.total_uncovered)); metric('filledTotal', asNumber(projectRow.filled_total));
            metric('fillRate', fmtRate(projectRow.fill_rate)); metric('confirmedRate', fmtRate(projectRow.confirmed_rate));
            renderTable('dirTable', data.dirs || [], 'dir_path'); renderTable('fileTable', data.files || [], 'file_path');
            statusEl.innerText = `已加载项目：${project}，接口：${apiBase}`;
            const url = new URL(window.location.href);
            url.searchParams.set('project', project);
            if (params.get('api')) {
              url.searchParams.set('api', apiBase);
            }
            window.history.replaceState(null, '', url.toString());
            return;
          } catch (error) {
            lastError = error;
          }
        }
        statusEl.innerHTML = `<span class="error">加载失败：${lastError ? lastError.message : '无法连接接口'}。已尝试：${candidates.join(' , ')}</span>`;
      } finally {
        loadBtn.disabled = false;
        loadBtn.innerText = '查看进度';
      }
    }

    document.getElementById('loadBtn').addEventListener('click', loadProgress);
    projectInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        loadProgress();
      }
    });
    if (projectInput.value.trim()) {
      loadProgress();
    }
  </script>
</body>
</html>
