<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coverage Analysis Progress</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --panel: #fff;
      --line: #d8e0ea;
      --text: #172033;
      --muted: #64748b;
      --head: #eef3f8;
      --blue: #1f5fbf;
      --green: #1f9d55;
      --red: #b91c1c;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "Microsoft YaHei", sans-serif;
    }
    header { padding: 18px 24px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
    h1 { margin: 0 0 12px; font-size: 22px; line-height: 1.2; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input {
      width: min(420px, 100%);
      height: 34px;
      border: 1px solid #bcc7d4;
      border-radius: 4px;
      padding: 0 10px;
      font-size: 14px;
    }
    button, a.button {
      height: 34px;
      border: 1px solid #c7d8ff;
      border-radius: 4px;
      background: #eef4ff;
      color: var(--blue);
      padding: 0 12px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    button:hover, a.button:hover { background: #dfeaff; }
    main { padding: 18px 24px 32px; }
    .cards { display: grid; grid-template-columns: repeat(6, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; }
    .label { color: var(--muted); font-size: 12px; }
    .value { font-size: 24px; font-weight: 800; margin-top: 4px; }
    .section { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; margin-top: 14px; overflow: hidden; }
    .section h2 { margin: 0; padding: 10px 12px; font-size: 15px; background: var(--head); border-bottom: 1px solid var(--line); }
    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 920px; }
    th, td { border-bottom: 1px solid #e7edf4; padding: 7px 8px; text-align: left; vertical-align: top; }
    th { background: #f8fafc; position: sticky; top: 0; z-index: 1; }
    td.path { word-break: break-all; }
    .bar {
      display: inline-block;
      width: 90px;
      height: 8px;
      background: #e5e7eb;
      border-radius: 4px;
      overflow: hidden;
      margin-left: 8px;
      vertical-align: middle;
    }
    .bar span { display: block; height: 100%; background: var(--green); }
    .status { margin-top: 10px; color: var(--muted); }
    .page-version { margin-top: 7px; color: var(--muted); font-size: 12px; }
    .error { color: var(--red); }
    .warning { color: #a16207; }
    .matched { color: var(--green); }
    .unmatched { color: var(--red); font-weight: 700; }
    .ownership-status { margin-top: 7px; color: var(--muted); }
    .job-progress {
      display: none;
      margin-top: 12px;
      max-width: 920px;
      padding: 12px;
      border: 1px solid #bfd3ff;
      border-radius: 6px;
      background: #f5f8ff;
    }
    .job-progress.visible { display: block; }
    .job-progress-head { display: flex; justify-content: space-between; gap: 12px; font-weight: 700; }
    .job-track { height: 10px; margin: 8px 0; overflow: hidden; border-radius: 5px; background: #dbe5f3; }
    .job-track span { display: block; width: 0; height: 100%; background: var(--blue); transition: width .25s ease; }
    .job-progress.active .job-track span {
      background-image: linear-gradient(45deg, rgba(255,255,255,.26) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.26) 50%, rgba(255,255,255,.26) 75%, transparent 75%, transparent);
      background-size: 22px 22px;
      animation: progress-stripes .7s linear infinite;
    }
    @keyframes progress-stripes { from { background-position: 0 0; } to { background-position: 22px 0; } }
    .file-detail-link { height: auto; padding: 0; border: 0; background: transparent; text-align: left; font-weight: 600; }
    .file-detail-link:hover { background: transparent; text-decoration: underline; }
    .detail-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; background: var(--head); border-bottom: 1px solid var(--line); }
    .detail-head h2 { padding: 0; border: 0; }
    .detail-nav { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
    .detail-nav button { height: 30px; }
    #detailTable { min-width: 1500px; }
    #detailTable td.code { max-width: 520px; white-space: pre-wrap; word-break: break-all; font-family: monospace; }
    .toggle-team-btn {
      height: 20px;
      width: 20px;
      padding: 0;
      border: 1px solid #cbd5e1;
      border-radius: 3px;
      background: #ffffff;
      color: #475569;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
      margin-right: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .toggle-team-btn:hover { background: #e2e8f0; color: #1e293b; }
    .toggle-team-spacer { display: inline-block; width: 26px; }
    .section-header-flex { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: var(--head); border-bottom: 1px solid var(--line); }
    .section-header-flex h2 { padding: 0 !important; border: 0 !important; background: transparent !important; }
    .small-btn { height: 26px; padding: 0 8px; font-size: 12px; font-weight: 600; }
    @media (max-width: 900px) { .cards { grid-template-columns: repeat(2, minmax(150px, 1fr)); } }
  </style>
</head>
<body data-review-scope="full">
  <header>
    <h1 id="pageTitle">全量覆盖率分析进度</h1>
    <div class="controls">
      <input id="projectInput" list="projectOptions" placeholder="输入或选择数据库中的项目">
      <datalist id="projectOptions"></datalist>
      <button id="loadBtn" type="button">查看进度</button>
      <a id="csvLink" class="button" href="#" target="_blank">导出进度 Excel</a>
      <a id="excelLink" class="button" href="#" target="_blank">导出目录 Excel ZIP</a>
      <button id="detailExportBtn" type="button">后台导出详细 CSV</button>
      <a id="detailDownloadLink" class="button" href="#" hidden>下载详细 CSV</a>
    </div>
    <div class="page-version">页面版本 visible-progress-20260813 · 点击后应立即显示进度条</div>
    <div id="status" class="status"></div>
    <div id="jobProgress" class="job-progress" role="status" aria-live="polite">
      <div class="job-progress-head"><span id="jobStage">准备中</span><span id="jobPercent">0%</span></div>
      <div class="job-track"><span id="jobBar"></span></div>
      <div id="jobMessage" class="status"></div>
    </div>
  </header>
  <main>
    <div class="cards">
      <div class="card"><div id="totalUncoveredLabel" class="label">未覆盖行总数</div><div id="totalUncovered" class="value">-</div></div>
      <div class="card"><div class="label">已填写</div><div id="filledTotal" class="value">-</div></div>
      <div class="card"><div class="label">填写率</div><div id="fillRate" class="value">-</div></div>
      <div class="card"><div class="label">确认率</div><div id="confirmedRate" class="value">-</div></div>
      <div class="card"><div class="label">归属已匹配文件</div><div id="matchedFiles" class="value">-</div></div>
      <div class="card"><div class="label">归属未匹配文件</div><div id="unmatchedFiles" class="value">-</div></div>
    </div>
    <div id="ownershipStatus" class="ownership-status"></div>
    <section class="section">
      <div class="section-header-flex">
        <h2>小组 / 组长填写进度（支持展开模块明细）</h2>
        <div>
          <button id="expandAllTeamModulesBtn" type="button" class="small-btn">▶ 展开全部模块</button>
          <button id="collapseAllTeamModulesBtn" type="button" class="small-btn">▼ 折叠全部模块</button>
        </div>
      </div>
      <div class="table-wrap"><table id="teamTable"></table></div>
    </section>
    <section class="section">
      <h2>目录进度</h2>
      <div class="table-wrap"><table id="dirTable"></table></div>
    </section>
    <section class="section">
      <h2>文件进度（点击文件路径查看详细填写数据）</h2>
      <div class="table-wrap"><table id="fileTable"></table></div>
    </section>
    <section id="detailSection" class="section" hidden>
      <div class="detail-head"><h2 id="detailTitle">详细填写数据</h2><button id="closeDetailBtn" type="button">关闭</button></div>
      <div id="detailStatus" class="detail-nav"></div>
      <div class="table-wrap"><table id="detailTable"></table></div>
    </section>
  </main>
  <script src="coverage_progress.js?v=visible-progress-20260813"></script>
</body>
</html>
