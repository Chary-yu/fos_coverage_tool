<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOS R8 Candidate Browser Validation</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:24px;background:#f5f5f7;color:#1d1d1f}
main{max-width:960px;margin:auto;background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 28px rgba(0,0,0,.08)}
button{border:0;border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer}
pre{white-space:pre-wrap;background:#111;color:#ddd;padding:16px;border-radius:12px;max-height:360px;overflow:auto}
iframe{width:100%;height:520px;border:1px solid #ddd;border-radius:12px;margin-top:16px}.ok{color:#16803a}.bad{color:#b42318}
</style>
</head>
<body><main>
<h2>FOS R8 Air-Gapped Candidate Validation</h2>
<p>只验证当前隔离 Candidate；本页不会切换生产 CURRENT，也不会访问公网。</p>
<button id="run" type="button">开始真实浏览器验证</button>
<p id="status">等待开始</p>
<pre id="log"></pre>
<iframe id="candidate" title="Candidate report"></iframe>
<script>
(() => {
  'use strict';
  const API='/api/coverage';
  const logNode=document.getElementById('log');
  const statusNode=document.getElementById('status');
  const runButton=document.getElementById('run');
  const frame=document.getElementById('candidate');
  const log=(message)=>{logNode.textContent+=`${message}\n`;logNode.scrollTop=logNode.scrollHeight;};
  const wait=(ms)=>new Promise(resolve=>setTimeout(resolve,ms));

  async function waitFor(fn, timeout=120000) {
    const started=Date.now();
    for (;;) {
      try { const value=fn(); if (value) return value; } catch (_) {}
      if (Date.now()-started > timeout) throw new Error('等待 Candidate 页面超时');
      await wait(100);
    }
  }

  function browserIdentity() {
    const ua=navigator.userAgent||'';
    let product='other';
    if (/Edg\//.test(ua)) product='edge';
    else if (/Chrome\//.test(ua)) product='chrome';
    else if (/Chromium\//.test(ua)) product='chromium';
    return {
      browser_name: product==='other' ? product : 'chromium',
      browser_product: product,
      user_agent: ua,
      platform: navigator.platform||'',
      language: navigator.language||''
    };
  }

  async function jsonFetch(url, options) {
    const response=await fetch(url,Object.assign({cache:'no-store',credentials:'include'},options||{}));
    let payload=null;
    try { payload=await response.json(); } catch (_) {}
    return {status:response.status,ok:response.ok,payload};
  }

  async function loadCandidate(url) {
    return await new Promise((resolve,reject)=>{
      const timer=setTimeout(()=>reject(new Error('Candidate HTML 加载超时')),120000);
      frame.onload=()=>{clearTimeout(timer);resolve(frame.contentWindow);};
      frame.src=url+(url.includes('?')?'&':'?')+'fos_release_validation='+Date.now();
    });
  }

  async function inspectReport(win, context) {
    const doc=win.document;
    await waitFor(()=>doc && doc.documentElement && doc.body);
    const jsErrors=[];
    const onError=(event)=>jsErrors.push(String(event && (event.message||event.error) || 'browser error'));
    win.addEventListener('error',onError);
    try {
      const source=doc.querySelector('pre.source');
      const lineNodes=Array.from(doc.querySelectorAll('[id^="L"]')).filter(node=>/^L\d+$/.test(node.id));
      const tables=doc.querySelectorAll('table').length;
      const visibleContentUnits=Math.max(lineNodes.length,tables,source&&source.textContent.trim()?1:0);
      if (visibleContentUnits < 1) throw new Error('真实报告未发现可见源码/表格内容');

      let vnextInteraction={attempted:false,passed:true,region_id:'',line_count:0};
      const internals=win.__COVERAGE_ENHANCE_INTERNALS__;
      if (internals && internals.CodeRegionStore && internals.CodeRegionController) {
        const regions=internals.CodeRegionStore.getAll ? internals.CodeRegionStore.getAll() : [];
        if (regions && regions.length) {
          const region=regions[0];
          vnextInteraction.attempted=true;
          vnextInteraction.region_id=String(region.id||region.region_id||'');
          vnextInteraction.line_count=Number(region.lineCount||region.line_count||0);
          const expand=internals.CodeRegionController.expandRegion;
          if (typeof expand==='function') {
            try {
              await expand.call(internals.CodeRegionController, region.id||region.region_id);
              vnextInteraction.passed=true;
            } catch (error) {
              vnextInteraction.passed=false;
              jsErrors.push(String(error&&error.message||error));
            }
          }
        }
      }

      return {
        status: jsErrors.length===0 && vnextInteraction.passed ? 'PASSED' : 'FAILED',
        workload_id:'airgapped-real-candidate-report-v1',
        report_mode:context.report_mode,
        visible_content_units:visibleContentUnits,
        source_line_nodes:lineNodes.length,
        table_count:tables,
        source_pre_present:Boolean(source),
        vnext_interaction:vnextInteraction,
        js_errors:jsErrors,
        environment_identity:browserIdentity()
      };
    } finally {
      win.removeEventListener('error',onError);
    }
  }

  async function run() {
    runButton.disabled=true;
    statusNode.textContent='验证进行中';
    statusNode.className='';
    logNode.textContent='';
    try {
      const contextResult=await jsonFetch(`${API}/release-validation/context`);
      if (!contextResult.ok) throw new Error(`Context HTTP ${contextResult.status}: ${JSON.stringify(contextResult.payload)}`);
      const context=contextResult.payload;
      log(`Session: ${context.release_validation_session_id}`);
      log(`Candidate: ${context.candidate_revision}`);
      log(`Report: ${context.report_path}`);
      log(`Report mode: ${context.report_mode}`);

      const candidate=new URL(context.candidate_url,location.href);
      if (candidate.origin!==location.origin) throw new Error('Candidate URL 与验证页不同源');
      const win=await loadCandidate(candidate.href);

      const releaseResult=await jsonFetch(`${API}/release`);
      if (!releaseResult.ok) throw new Error(`Release HTTP ${releaseResult.status}`);
      const served=(releaseResult.payload||{}).release||{};
      if (served.commit_sha!==context.candidate_revision) throw new Error('Candidate release commit 不匹配');

      const workload=await inspectReport(win,context);
      log(`Real report workload: ${workload.status}, content=${workload.visible_content_units}`);
      if (workload.status!=='PASSED') throw new Error('真实 Candidate 报告浏览器检查失败');

      const authResult=await jsonFetch(`${API}/auth/mutation-probe`,{
        method:'POST',headers:{'Content-Type':'application/json'},body:'{}'
      });
      if (!authResult.ok) throw new Error(`Authenticated mutation probe HTTP ${authResult.status}`);

      const functional={
        status:'PASSED',
        report_loaded:true,
        release_identity_verified:true,
        immutable_manifest_report_bound:true,
        report_mode:context.report_mode
      };
      const submission={
        nonce:context.nonce,
        candidate_revision:context.candidate_revision,
        release_validation_session_id:context.release_validation_session_id,
        candidate_artifact_sha256:context.candidate_artifact_sha256,
        served_root_sha256:context.served_root_sha256,
        candidate_url:context.candidate_url,
        report_path:context.report_path,
        report_sha256:context.report_sha256,
        browser_functional:functional,
        operator_browser_workload:workload,
        authenticated_probe:{status_code:authResult.status,payload:authResult.payload||{}}
      };
      const submitResult=await jsonFetch(`${API}/release-validation/browser-observation`,{
        method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(submission)
      });
      if (!submitResult.ok) throw new Error(`Evidence submit HTTP ${submitResult.status}: ${JSON.stringify(submitResult.payload)}`);

      statusNode.textContent='PASSED — 浏览器观察已提交，可返回升级终端';
      statusNode.className='ok';
      log('Operator browser observation: PASSED');
      log('100k Performance A/B 由离线精确版本证据单独完成，不在本页伪造。');
      log(JSON.stringify(submitResult.payload,null,2));
    } catch (error) {
      statusNode.textContent='FAILED — 不要继续切换生产';
      statusNode.className='bad';
      log(`ERROR: ${String(error&&error.stack||error)}`);
    } finally {
      runButton.disabled=false;
    }
  }

  runButton.addEventListener('click',run);
})();
</script>
</main></body>
</html>
